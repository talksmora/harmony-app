<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Piano - Harmony Music</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="shared/theme.css">
<link rel="stylesheet" href="shared/app-shell.css">
<style>
  .piano-container {
    background: linear-gradient(135deg, #1e272c 0%, #0f1315 100%);
    border: 8px solid #07090a;
    border-radius: 24px;
    padding: 30px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    margin-top: 10px;
    color: #f7e6d5;
    position: relative;
    text-align: center;
  }

  .piano-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    background: rgba(0,0,0,0.3);
    padding: 15px 20px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.06);
    flex-wrap: wrap;
    gap: 15px;
  }

  .pedal-btn {
    background: #111;
    border: 2.5px solid #d4af37;
    color: #d4af37;
    padding: 12px 28px;
    border-radius: 14px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(212,175,55,0.15);
    transition: all 0.2s;
  }
  .pedal-btn.active {
    background: #d4af37;
    color: #111;
    box-shadow: 0 0 20px rgba(212,175,55,0.5);
  }

  .keyboard-guide-toggle {
    font-size: 0.8rem;
    color: var(--subtitle);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Keyboard container */
  .keys-wrapper {
    background: #000;
    padding: 15px 5px 5px;
    border-radius: 16px;
    border: 3px solid #111;
    position: relative;
    overflow-x: auto;
  }
  .keyboard-scroll {
    display: flex;
    position: relative;
    min-width: 980px;
    height: 240px;
  }
  .key {
    position: relative;
    flex-shrink: 0;
    height: 100%;
    cursor: pointer;
    user-select: none;
    transition: background-color 0.15s, transform 0.1s;
  }
  .key.white {
    width: 44px;
    background: linear-gradient(to bottom, #fff 0%, #f0f0f0 100%);
    border-right: 1px solid #ccc;
    border-bottom: 6px solid #d5d5d5;
    border-radius: 0 0 6px 6px;
    z-index: 1;
  }
  .key.white:active, .key.white.pressed {
    background: linear-gradient(to bottom, #eaeaea 0%, #d8d8d8 100%);
    border-bottom-width: 2px;
    transform: translateY(4px);
  }
  .key.black {
    width: 28px;
    height: 60%;
    background: linear-gradient(to bottom, #444 0%, #111 100%);
    border-radius: 0 0 5px 5px;
    border: 1px solid #000;
    z-index: 2;
    margin-left: -14px;
    margin-right: -14px;
    box-shadow: 0 5px 10px rgba(0,0,0,0.5);
  }
  .key.black:active, .key.black.pressed {
    background: linear-gradient(to bottom, #222 0%, #000 100%);
    height: 59%;
    transform: translateY(2px);
  }

  .key-label {
    position: absolute;
    bottom: 12px; left: 50%; transform: translateX(-50%);
    font-size: 0.65rem; color: #888;
    pointer-events: none;
    font-weight: 700;
  }
  .key.black .key-label { color: #aaa; bottom: 8px; }

  .kb-shortcut {
    position: absolute;
    top: 12px; left: 50%; transform: translateX(-50%);
    font-size: 0.55rem; color: #bbb;
    background: rgba(0,0,0,0.06);
    padding: 1px 4px; border-radius: 3px;
    font-weight: 600;
    pointer-events: none;
  }
  .key.black .kb-shortcut { color: #fff; background: rgba(255,255,255,0.15); top: 8px; }

  .velocity-hint {
    font-size: 0.75rem;
    color: var(--subtitle);
    margin-top: 15px;
    font-style: italic;
  }
</style>
</head>
<body data-page="instruments">
  <div id="appShellRoot"></div>
  <div id="pageBody" style="display:none;">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:15px;">
      <h2 id="lblPianoTitle" style="margin:0;">🎹 વર્ચ્યુઅલ પિયાનો</h2>
      <a href="instruments.html" id="btnBack" class="ctrl-btn" style="text-decoration:none; padding:8px 16px; font-size:0.8rem; font-weight:600; border-radius:12px; background:var(--border);">← પાછા જાઓ</a>
    </div>

    <div class="piano-container">
      <div class="piano-controls">
        <button class="pedal-btn" id="pedalBtn">サステイン ペダル (SUSTAIN PEDAL)</button>
        <div class="keyboard-guide-toggle">
          <input type="checkbox" id="shortcutToggle" checked>
          <label for="shortcutToggle" id="lblShortcutToggle">કીબોર્ડ શોર્ટકટ બતાવો (Show shortcuts)</label>
        </div>
      </div>

      <div class="keys-wrapper">
        <div class="keyboard-scroll" id="keyboard"></div>
      </div>

      <div class="velocity-hint" id="lblVelocityHint">ટિપ: કીના નીચલા ભાગમાં ક્લિક કરવાથી વધુ અવાજ આવશે અને ઉપરના ભાગમાં ઓછો. (Tip: Clicking lower on the key plays it louder)</div>
    </div>
  </div>

<script src="shared/utils.js"></script>
<script src="shared/supabase-client.js"></script>
<script src="shared/app-shell.js"></script>
<script>
(function(){
  const lang = (() => { try { return localStorage.getItem('harmonyAppLang') || 'gu'; } catch(e) { return 'gu'; } })();

  const TEXT = {
    gu: {
      title: '🎹 વર્ચ્યુઅલ પિયાનો',
      back: '← પાછા જાઓ',
      sustain: 'સસ્ટેન પેダル (SUSTAIN)',
      showShortcuts: 'કીબોર્ડ શોર્ટકટ બતાવો',
      hint: 'ટિપ: કીના નીચલા ભાગમાં ક્લિક કરવાથી વધુ અવાજ આવશે અને ઉપરના ભાગમાં ઓછો.'
    },
    hi: {
      title: '🎹 वर्चुअल पियानो',
      back: '← वापस जाएं',
      sustain: 'सस्टेन पेडल (SUSTAIN)',
      showShortcuts: 'कीबोर्ड शॉर्टकट दिखाएं',
      hint: 'टिप: कुंजी के निचले हिस्से पर क्लिक करने से तेज़ आवाज़ आएगी और ऊपरी हिस्से पर कम।'
    },
    en: {
      title: '🎹 Virtual Grand Piano',
      back: '← Go Back',
      sustain: 'SUSTAIN PEDAL (SPACEBAR)',
      showShortcuts: 'Show Keyboard Shortcuts',
      hint: 'Tip: Clicking lower on the key plays it louder (Velocity Sensitive).'
    }
  };
  const t = TEXT[lang] || TEXT.gu;

  document.getElementById('lblPianoTitle').textContent = t.title;
  document.getElementById('btnBack').textContent = t.back;
  document.getElementById('pedalBtn').textContent = t.sustain;
  document.getElementById('lblShortcutToggle').textContent = t.showShortcuts;
  document.getElementById('lblVelocityHint').textContent = t.hint;

  let audioCtx = null;
  let activeNotes = {};
  let sustainOn = false;

  const NOTES = [
    { note: 'C3', type: 'white', freq: 130.81, key: 'a' },
    { note: 'C#3', type: 'black', freq: 138.59, key: 'w' },
    { note: 'D3', type: 'white', freq: 146.83, key: 's' },
    { note: 'D#3', type: 'black', freq: 154.34, key: 'e' },
    { note: 'E3', type: 'white', freq: 164.81, key: 'd' },
    { note: 'F3', type: 'white', freq: 174.61, key: 'f' },
    { note: 'F#3', type: 'black', freq: 185.00, key: 't' },
    { note: 'G3', type: 'white', freq: 196.00, key: 'g' },
    { note: 'G#3', type: 'black', freq: 207.65, key: 'y' },
    { note: 'A3', type: 'white', freq: 220.00, key: 'h' },
    { note: 'A#3', type: 'black', freq: 233.08, key: 'u' },
    { note: 'B3', type: 'white', freq: 246.94, key: 'j' },
    
    { note: 'C4', type: 'white', freq: 261.63, key: 'k' },
    { note: 'C#4', type: 'black', freq: 277.18, key: 'o' },
    { note: 'D4', type: 'white', freq: 293.66, key: 'l' },
    { note: 'D#4', type: 'black', freq: 311.13, key: 'p' },
    { note: 'E4', type: 'white', freq: 329.63, key: ';' },
    { note: 'F4', type: 'white', freq: 349.23, key: 'z' },
    { note: 'F#4', type: 'black', freq: 369.99, key: 'x' },
    { note: 'G4', type: 'white', freq: 392.00, key: 'c' },
    { note: 'G#4', type: 'black', freq: 415.30, key: 'v' },
    { note: 'A4', type: 'white', freq: 440.00, key: 'b' },
    { note: 'A#4', type: 'black', freq: 466.16, key: 'n' },
    { note: 'B4', type: 'white', freq: 493.88, key: 'm' },

    { note: 'C5', type: 'white', freq: 523.25, key: ',' },
    { note: 'C#5', type: 'black', freq: 554.37, key: 'l' },
    { note: 'D5', type: 'white', freq: 587.33, key: '.' },
    { note: 'D#5', type: 'black', freq: 622.25, key: '/' }
  ];

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  // Piano Hammer String Synthesis
  function playPianoNote(freq, noteName, velocity = 0.5) {
    initAudio();
    if (activeNotes[noteName] && !sustainOn) {
      stopPianoNote(noteName);
    }

    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const oscStrike = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();

    osc1.type = 'sine';
    osc1.frequency.setValueAtTime(freq, audioCtx.currentTime);

    osc2.type = 'triangle';
    osc2.frequency.setValueAtTime(freq * 2, audioCtx.currentTime);
    osc2.detune.setValueAtTime(4, audioCtx.currentTime); // Chorus

    // High frequency percussive hammer strike simulation
    oscStrike.type = 'sine';
    oscStrike.frequency.setValueAtTime(freq * 4, audioCtx.currentTime);

    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(2000, audioCtx.currentTime);

    gainNode.gain.setValueAtTime(0.0, audioCtx.currentTime);
    gainNode.gain.linearRampToValueAtTime(0.4 * velocity, audioCtx.currentTime + 0.005);
    
    // Connect together
    osc1.connect(filter);
    osc2.connect(filter);
    oscStrike.connect(filter);
    filter.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    osc1.start();
    osc2.start();
    oscStrike.start();

    // Fade strike oscillator very fast
    oscStrike.stop(audioCtx.currentTime + 0.05);

    // Natural decay curve
    const decayDuration = sustainOn ? 3.0 : 1.2;
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + decayDuration);

    activeNotes[noteName] = { osc1, osc2, gain: gainNode, stopTime: audioCtx.currentTime + decayDuration };
  }

  function stopPianoNote(noteName) {
    const node = activeNotes[noteName];
    if (!node) return;

    if (sustainOn) return; // let it ring

    node.gain.gain.setValueAtTime(node.gain.gain.value, audioCtx.currentTime);
    node.gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

    setTimeout(() => {
      try {
        node.osc1.stop();
        node.osc2.stop();
      } catch(e) {}
    }, 350);

    delete activeNotes[noteName];
  }

  function toggleSustain() {
    sustainOn = !sustainOn;
    const btn = document.getElementById('pedalBtn');
    if (sustainOn) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
      // Stop all decaying notes
      Object.keys(activeNotes).forEach(stopPianoNote);
    }
  }

  // Draw Keyboard DOM
  function renderKeyboard() {
    const keyboardEl = document.getElementById('keyboard');
    keyboardEl.innerHTML = '';

    NOTES.forEach(noteInfo => {
      const key = document.createElement('div');
      key.className = `key ${noteInfo.type}`;
      key.id = 'key-' + noteInfo.note;

      const labelEl = document.createElement('span');
      labelEl.className = 'key-label';
      labelEl.textContent = noteInfo.note;
      key.appendChild(labelEl);

      const shortcutEl = document.createElement('span');
      shortcutEl.className = 'kb-shortcut';
      shortcutEl.textContent = noteInfo.key.toUpperCase();
      key.appendChild(shortcutEl);

      // Touch / Mouse trigger with Y offset velocity calculation
      const startTrigger = (e) => {
        e.preventDefault();
        key.classList.add('pressed');
        
        let clientY = 0;
        if (e.touches && e.touches[0]) {
          clientY = e.touches[0].clientY;
        } else {
          clientY = e.clientY;
        }
        
        const rect = key.getBoundingClientRect();
        const offsetY = clientY - rect.top;
        const velocity = Math.min(1.0, Math.max(0.15, offsetY / rect.height));

        playPianoNote(noteInfo.freq, noteInfo.note, velocity);
      };

      const endTrigger = (e) => {
        e.preventDefault();
        key.classList.remove('pressed');
        stopPianoNote(noteInfo.note);
      };

      key.addEventListener('mousedown', startTrigger);
      key.addEventListener('mouseup', endTrigger);
      key.addEventListener('mouseleave', endTrigger);

      key.addEventListener('touchstart', startTrigger);
      key.addEventListener('touchend', endTrigger);

      keyboardEl.appendChild(key);
    });
  }

  // Keyboard Shortcuts Listener
  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.code === 'Space') {
      e.preventDefault();
      toggleSustain();
      return;
    }
    const noteInfo = NOTES.find(n => n.key === e.key.toLowerCase());
    if (noteInfo) {
      const keyEl = document.getElementById('key-' + noteInfo.note);
      if (keyEl) keyEl.classList.add('pressed');
      playPianoNote(noteInfo.freq, noteInfo.note);
    }
  });

  window.addEventListener('keyup', (e) => {
    const noteInfo = NOTES.find(n => n.key === e.key.toLowerCase());
    if (noteInfo) {
      const keyEl = document.getElementById('key-' + noteInfo.note);
      if (keyEl) keyEl.classList.remove('pressed');
      stopPianoNote(noteInfo.note);
    }
  });

  document.getElementById('pedalBtn').onclick = toggleSustain;
  document.getElementById('shortcutToggle').onchange = function() {
    document.querySelectorAll('.kb-shortcut').forEach(el => {
      el.style.display = this.checked ? 'block' : 'none';
    });
  };

  renderKeyboard();
  initAppShell({ title: t.title });
})();
</script>
</body>
</html>
