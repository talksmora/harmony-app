<style>
  .universal-container {
    background: linear-gradient(135deg, #1e272c 0%, #0f1315 100%);
    border: 8px solid #07090a;
    border-radius: 24px;
    padding: 30px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    margin-top: 10px;
    color: #f7e6d5;
    position: relative;
    text-align: center;
    min-height: 400px;
  }

  .inst-title-area {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  /* Dynamic visual layouts */
  .strings-layout {
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    height: 250px;
    background: radial-gradient(circle, #2d140a 0%, #0f0502 100%);
    border-radius: 16px;
    padding: 20px;
    position: relative;
  }
  .string-row {
    height: 30px;
    display: flex;
    align-items: center;
    cursor: pointer;
    position: relative;
  }
  .string-wire {
    width: 100%;
    height: 2px;
    background: linear-gradient(to bottom, #ccc, #888);
    transition: background 0.1s;
  }
  .string-row:hover .string-wire, .string-row.active .string-wire {
    background: #f1c40f;
    box-shadow: 0 0 10px #f1c40f;
  }
  .string-label {
    position: absolute;
    left: -15px;
    font-size: 0.7rem;
    font-weight: 800;
    color: #e67e22;
  }

  /* Drum Pads Layout */
  .drums-layout {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 15px;
    max-width: 500px;
    margin: 0 auto;
  }
  .drum-pad {
    height: 110px;
    border-radius: 50%;
    background: radial-gradient(circle, #555, #222);
    border: 4px solid #444;
    cursor: pointer;
    box-shadow: 0 6px 12px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 0.85rem;
    color: #fff;
    transition: transform 0.08s, background 0.08s;
    user-select: none;
  }
  .drum-pad:active, .drum-pad.active {
    transform: scale(0.92);
    background: radial-gradient(circle, #e74c3c, #c0392b);
    border-color: #ff6b6b;
  }

  /* Circular Tongue layout */
  .tongue-layout {
    width: 320px;
    height: 320px;
    background: radial-gradient(circle, #566573 0%, #2c3e50 60%, #1c2833 100%);
    border: 5px solid #34495e;
    border-radius: 50%;
    margin: 0 auto;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .tongue-petal {
    width: 60px;
    height: 60px;
    background: radial-gradient(circle, #7f8c8d 0%, #34495e 100%);
    border: 2px solid #fff;
    border-radius: 50%;
    position: absolute;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    color: #fff;
    font-size: 0.75rem;
    transition: transform 0.1s;
  }
  .tongue-petal:active, .tongue-petal.active {
    transform: scale(1.1);
    box-shadow: 0 0 15px #f1c40f;
  }

  /* 2D Pad layout for Theremin */
  .theremin-pad {
    width: 100%;
    height: 300px;
    background: #000;
    border: 3px dashed var(--accent);
    border-radius: 16px;
    position: relative;
    cursor: crosshair;
    overflow: hidden;
  }
  .theremin-indicator {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #fff;
    transform: translate(-50%, -50%);
    pointer-events: none;
    display: none;
    box-shadow: 0 0 15px var(--accent);
  }

  /* Simple keyboard-style buttons for wind/keys */
  .button-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
    gap: 12px;
    max-width: 600px;
    margin: 0 auto;
  }
  .grid-btn {
    padding: 18px 10px;
    background: #250f07;
    border: 2px solid #5a2e1e;
    color: #f7e6d5;
    border-radius: 12px;
    font-weight: 800;
    font-size: 0.9rem;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    transition: all 0.1s;
    user-select: none;
  }
  .grid-btn:active, .grid-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    transform: scale(0.95);
  }

  .interactive-hint {
    font-size: 0.75rem;
    color: var(--subtitle);
    margin-top: 20px;
    font-style: italic;
  }

  /* Sequencer Grid */
  .seq-grid {
    display: grid;
    grid-template-columns: 80px repeat(8, 1fr);
    gap: 6px;
    max-width: 600px;
    margin: 0 auto;
  }
  .seq-cell {
    height: 32px;
    background: #111;
    border: 1px solid #333;
    border-radius: 4px;
    cursor: pointer;
  }
  .seq-cell.active {
    background: var(--accent);
  }
  .seq-cell.playing {
    border-color: #fff;
  }
  .seq-label {
    display: flex;
    align-items: center;
    font-size: 0.75rem;
    font-weight: 800;
  }
</style>
</head>

  let feedbackNode = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  // Generic Sound Synthesizer
  function playNote(freq) {
    initAudio();
    const osc = audioCtx.createOscillator();
    const oscHarm = config.harmonic ? audioCtx.createOscillator() : null;
    const gainNode = audioCtx.createGain();
    const filter = config.breath ? audioCtx.createBiquadFilter() : null;

    osc.type = config.osc || 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

    if (oscHarm) {
      oscHarm.type = config.osc || 'sine';
      oscHarm.frequency.setValueAtTime(freq * config.harmonic, audioCtx.currentTime);
    }

    // ADSR Envelope
    const A = config.attack || 0.01;
    const D = config.decay || 1.2;
    const G = config.gain || 0.35;

    gainNode.gain.setValueAtTime(0.0, audioCtx.currentTime);
    gainNode.gain.linearRampToValueAtTime(G, audioCtx.currentTime + A);
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + A + D);

    if (filter) {
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.connect(filter);
      if (oscHarm) oscHarm.connect(filter);
      filter.connect(gainNode);
    } else {
      osc.connect(gainNode);
      if (oscHarm) oscHarm.connect(gainNode);
    }

    // Vibrato LFO
    if (config.vibrato) {
      const lfo = audioCtx.createOscillator();
      const lfoGain = audioCtx.createGain();
      lfo.frequency.setValueAtTime(6, audioCtx.currentTime);
      lfoGain.gain.setValueAtTime(8, audioCtx.currentTime);
      lfo.connect(lfoGain);
      lfoGain.connect(osc.frequency);
      lfo.start();
      lfo.stop(audioCtx.currentTime + A + D);
    }

    gainNode.connect(audioCtx.destination);
    osc.start();
    if (oscHarm) oscHarm.start();

    osc.stop(audioCtx.currentTime + A + D + 0.1);
    if (oscHarm) oscHarm.stop(audioCtx.currentTime + A + D + 0.1);
  }

  // Synthesize Drum Pad Sounds
  function playDrum(padName) {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    if (padName === 'Kick') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      gainNode.gain.setValueAtTime(1.0, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.16);
    } else if (padName === 'Snare' || padName === 'Hi-Hat') {
      // Noise buffer for percussive crack/hiss
      const bufferSize = audioCtx.sampleRate * (padName === 'Snare' ? 0.2 : 0.05);
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (padName === 'Snare' ? 0.18 : 0.04));
      source.connect(noiseGain);
      noiseGain.connect(audioCtx.destination);
      source.start();
    } else {
      // Cymbal crash / tom tone
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(padName === 'Crash' ? 400 : 200, audioCtx.currentTime);
      gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.9);
    }
  }

  // Draw Layout DOM dynamically
  const area = document.getElementById('dynamicInstrumentArea');

  if (config.layout === 'strings') {
    const layout = document.createElement('div');
    layout.className = 'strings-layout';
    
    config.strings.forEach((freq, idx) => {
      const row = document.createElement('div');
      row.className = 'string-row';
      
      const wire = document.createElement('div');
      wire.className = 'string-wire';
      row.appendChild(wire);

      const label = document.createElement('span');
      label.className = 'string-label';
      label.textContent = config.labels[idx];
      row.appendChild(label);

      const trigger = () => {
        row.classList.add('active');
        playNote(freq);
        setTimeout(() => row.classList.remove('active'), 100);
      };

      row.onpointerenter = trigger;
      row.onmousedown = trigger;
      layout.appendChild(row);
    });
    
    area.appendChild(layout);
  } else if (config.layout === 'buttons') {
    const layout = document.createElement('div');
    layout.className = 'button-grid';

    config.notes.forEach((freq, idx) => {
      const btn = document.createElement('button');
      btn.className = 'grid-btn';
      btn.textContent = config.labels[idx];
      btn.onclick = () => {
        btn.classList.add('active');
        playNote(freq);
        setTimeout(() => btn.classList.remove('active'), 100);
      };
      layout.appendChild(btn);
    });

    area.appendChild(layout);
  } else if (config.layout === 'drums') {
    const layout = document.createElement('div');
    layout.className = 'drums-layout';

    config.pads.forEach(pad => {
      const padEl = document.createElement('div');
      padEl.className = 'drum-pad';
      padEl.textContent = pad;
      padEl.onclick = () => {
        padEl.classList.add('active');
        playDrum(pad);
        setTimeout(() => padEl.classList.remove('active'), 100);
      };
      layout.appendChild(padEl);
    });

    area.appendChild(layout);
  } else if (config.layout === 'tongue') {
    const layout = document.createElement('div');
    layout.className = 'tongue-layout';

    config.notes.forEach((freq, idx) => {
      const petal = document.createElement('div');
      petal.className = 'tongue-petal';
      petal.textContent = config.labels[idx];
      
      // PositionSurrounding
      const angle = (idx / 8) * 2 * Math.PI;
      const x = 130 + 100 * Math.cos(angle);
      const y = 130 + 100 * Math.sin(angle);
      petal.style.left = x + 'px';
      petal.style.top = y + 'px';

      petal.onclick = () => {
        petal.classList.add('active');
        playNote(freq);
        setTimeout(() => petal.classList.remove('active'), 100);
      };
      layout.appendChild(petal);
    });

    area.appendChild(layout);
  } else if (config.layout === 'theremin') {
    const pad = document.createElement('div');
    pad.className = 'theremin-pad';
    
    const indicator = document.createElement('div');
    indicator.className = 'theremin-indicator';
    pad.appendChild(indicator);

    let osc = null;
    let gain = null;

    const playTheremin = (e) => {
      initAudio();
      const rect = pad.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const x = clientX - rect.left;
      const y = clientY - rect.top;

      // Frequency map: X axis (100Hz to 1200Hz)
      const freq = 100 + (x / rect.width) * 1100;
      // Volume map: Y axis (0 to 0.45)
      const vol = 0.45 * (1.0 - (y / rect.height));

      indicator.style.left = x + 'px';
      indicator.style.top = y + 'px';
      indicator.style.display = 'block';

      if (!osc) {
        osc = audioCtx.createOscillator();
        gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
      }

      osc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.05);
      gain.gain.setTargetAtTime(vol, audioCtx.currentTime, 0.05);
    };

    const stopTheremin = () => {
      indicator.style.display = 'none';
      if (osc) {
        osc.stop();
        osc.disconnect();
        gain.disconnect();
        osc = null;
        gain = null;
      }
    };

    pad.onpointerdown = (e) => {
      pad.setPointerCapture(e.pointerId);
      playTheremin(e);
    };
    pad.onpointermove = (e) => {
      if (e.buttons > 0) playTheremin(e);
    };
    pad.onpointerup = stopTheremin;
    pad.onpointercancel = stopTheremin;

    area.appendChild(pad);
  } else if (config.layout === 'sequencer') {
    // 8-step simple drum machine sequencer grid
    const layout = document.createElement('div');
    layout.className = 'seq-grid';

    const tracks = ['Kick', 'Snare', 'Hi-Hat', 'Tom'];
    const gridState = tracks.map(() => Array(8).fill(false));

    tracks.forEach((track, tIdx) => {
      const label = document.createElement('div');
      label.className = 'seq-label';
      label.textContent = track;
      layout.appendChild(label);

      for (let s = 0; s < 8; s++) {
        const cell = document.createElement('div');
        cell.className = 'seq-cell';
        cell.onclick = () => {
          gridState[tIdx][s] = !gridState[tIdx][s];
          cell.classList.toggle('active');
        };
        layout.appendChild(cell);
      }
    });

    area.appendChild(layout);

    // Playback loop
    let step = 0;
    setInterval(() => {
      if (!isListening) return; // borrow listening flag as loop run flag
      
      // Visual indicator line
      const cells = document.querySelectorAll('.seq-cell');
      cells.forEach(c => c.classList.remove('playing'));

      tracks.forEach((track, tIdx) => {
        const cellIdx = tIdx * 8 + step;
        const cell = cells[cellIdx];
        if (cell) cell.classList.add('playing');

        if (gridState[tIdx][step]) {
          playDrum(track);
        }
      });

      step = (step + 1) % 8;
    }, 220); // ~135 BPM

    isListening = true; // Auto-start sequencer loop
  }

  initAppShell({ title: title });
})();
</script>
</body>
</html>
