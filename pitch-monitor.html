<script>
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
// Sargam base letters WITH old text suffix (કો/તી) — kept as requested, marks are ADDED on top of this
const SARGAM_BASE = ['સા','રે કો','રે','ગ કો','ગ','મ','મ','પા','ધ કો','ધ','ની કો','ની'];
// type of each of the 12 semitone steps relative to Sa: 'sa' | 'shuddh' | 'komal' | 'tivra' | 'pa'
const SARGAM_TYPE = ['sa','komal','shuddh','komal','shuddh','shuddh','tivra','pa','komal','shuddh','komal','shuddh'];

// Per-instrument key ranges (MIDI numbers)
const HARMONIUM_RANGE = { min: 36, max: 71 };   // C2..B4 — exactly 3 fixed saptaks
const PIANO_RANGE = { min: 21, max: 108 };       // A0..C8 — full 88-key range, dynamic saptaks

let MIDI_MIN = HARMONIUM_RANGE.min;
let MIDI_MAX = HARMONIUM_RANGE.max;
const isBlackMidi = m => [1,3,6,8,10].includes(m % 12);

function midiToFreq(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }
function freqToMidiFloat(freq) { return 69 + 12 * Math.log2(freq / 440); }
function noteName(midi) {
  const idx = ((Math.round(midi) % 12) + 12) % 12;
  const octave = Math.floor(Math.round(midi) / 12) - 1;
  return NOTE_NAMES[idx] + octave;
}
let tonicOffset = 0; // semitone (0=C) chosen as user's Sa — only decides WHICH swar is "Sa", never the saptak boundaries

function setKeyRangeForInstrument(inst) {
  const r = inst === 'piano' ? PIANO_RANGE : HARMONIUM_RANGE; // tanpura doesn't use this
  MIDI_MIN = r.min;
  MIDI_MAX = r.max;
}

// saptak is ALWAYS anchored to fixed octave-numbers: C3–B3 = madhya (octave number 3), regardless of chosen Sa
// returns { relOctave, dotCount, side: 'below'|'above'|'none' }
function saptakInfoForMidi(midi) {
  const octaveNumber = Math.floor(Math.round(midi) / 12) - 1; // matches noteName's convention (C4 => 4)
  const rel = octaveNumber - 3; // 0 = madhya (C3-B3)
  if (rel === 0) return { dotCount: 0, side: 'none' };
  const dotCount = Math.min(Math.abs(rel), 3); // cap at 3 dots (અતિશય મન્દ્ર/તાર) per classical convention
  return { dotCount, side: rel < 0 ? 'below' : 'above' };
}

// returns { text, type, dotCount, side }
function sargamName(midi) {
  const rounded = Math.round(midi);
  const idx = ((rounded % 12) + 12) % 12;
  const rel = ((idx - tonicOffset) % 12 + 12) % 12;
  const saptak = saptakInfoForMidi(rounded);
  return { text: SARGAM_BASE[rel], type: SARGAM_TYPE[rel], dotCount: saptak.dotCount, side: saptak.side };
}
function sargamDisplayString(midi) {
  const s = sargamName(midi);
  return s.type === 'tivra' ? (s.text + '\u2019') : s.text;
}

// ---------- Build piano (responsive, fits full width, no scroll) ----------
const piano = document.getElementById('piano');
const pianoWrap = document.querySelector('.piano-wrap');
let whiteKeyWidth = 20;
let blackKeyWidth = 12;
let totalWidth = 0;
const whitePositions = {};

function buildSargamLabelEl(midi) {
  const info = sargamName(midi);
  const wrap = document.createElement('span');
  wrap.className = 'sargam-wrap';

  if (info.side === 'above') {
    const dots = document.createElement('span');
    dots.className = 'sargam-dots sargam-dots-above';
    dots.textContent = '•'.repeat(info.dotCount);
    wrap.appendChild(dots);
  }
  const letterSpan = document.createElement('span');
  letterSpan.className = 'sargam-letter sargam-' + info.type;
  letterSpan.textContent = info.type === 'tivra' ? (info.text + '\u2019') : info.text;
  wrap.appendChild(letterSpan);
  if (info.side === 'below') {
    const dots = document.createElement('span');
    dots.className = 'sargam-dots sargam-dots-below';
    dots.textContent = '•'.repeat(info.dotCount);
    wrap.appendChild(dots);
  }
  return wrap;
}

function buildPiano() {
  piano.innerHTML = '';
  const containerWidth = pianoWrap.clientWidth;
  let whiteCount = 0;
  for (let m = MIDI_MIN; m <= MIDI_MAX; m++) if (!isBlackMidi(m)) whiteCount++;
  whiteKeyWidth = containerWidth / whiteCount;
  blackKeyWidth = whiteKeyWidth * 0.6;

  let xPos = 0;
  for (let m = MIDI_MIN; m <= MIDI_MAX; m++) {
    if (!isBlackMidi(m)) { whitePositions[m] = xPos; xPos += whiteKeyWidth; }
  }
  totalWidth = xPos;
  piano.style.width = totalWidth + 'px';

  for (let m = MIDI_MIN; m <= MIDI_MAX; m++) {
    if (!isBlackMidi(m)) {
      const key = document.createElement('div');
      key.className = 'key white';
      key.style.left = whitePositions[m] + 'px';
      key.style.width = whiteKeyWidth + 'px';
      key.style.height = '130px';
      key.dataset.midi = m;
      if (m % 12 === tonicOffset) key.classList.add('sa-key');
      const label = document.createElement('div');
      label.className = 'key-label';
      label.appendChild(buildSargamLabelEl(m));
      key.appendChild(label);
      piano.appendChild(key);
    }
  }
  for (let m = MIDI_MIN; m <= MIDI_MAX; m++) {
    if (isBlackMidi(m)) {
      const leftWhite = whitePositions[m - 1] !== undefined ? whitePositions[m - 1] : whitePositions[m - 2];
      const key = document.createElement('div');
      key.className = 'key black';
      key.style.left = (leftWhite + whiteKeyWidth - blackKeyWidth / 2) + 'px';
      key.style.width = blackKeyWidth + 'px';
      key.style.height = '78px';
      key.dataset.midi = m;
      if (m % 12 === tonicOffset) key.classList.add('sa-key');
      const label = document.createElement('div');
      label.className = 'key-label black-label';
      label.appendChild(buildSargamLabelEl(m));
      key.appendChild(label);
      piano.appendChild(key);
    }
  }
  const marker = document.createElement('div');
  marker.className = 'piano-marker';
  marker.id = 'pianoMarker';
  piano.appendChild(marker);
}

function noteCenterX(midi) {
  if (isBlackMidi(midi)) {
    let leftWhite = whitePositions[midi - 1] !== undefined ? whitePositions[midi - 1] : whitePositions[midi - 2];
    if (leftWhite === undefined) leftWhite = 0;
    return leftWhite + whiteKeyWidth - blackKeyWidth / 2 + blackKeyWidth / 2;
  }
  const x = whitePositions[midi] !== undefined ? whitePositions[midi] : 0;
  return x + whiteKeyWidth / 2;
}

function midiFloatToX(midiFloat) {
  const lower = Math.floor(midiFloat);
  const upper = lower + 1;
  const frac = midiFloat - lower;
  const clampedLower = Math.max(MIDI_MIN, Math.min(MIDI_MAX, lower));
  const clampedUpper = Math.max(MIDI_MIN, Math.min(MIDI_MAX, upper));
  const xLower = noteCenterX(clampedLower);
  const xUpper = noteCenterX(clampedUpper);
  return xLower + (xUpper - xLower) * frac;
}

// ---------- Multi-instrument sound engine ----------
let playbackCtx;
const activeVoices = {}; // midi -> voice data
let currentInstrument = 'harmonium';
let tanpuraTimeouts = [];
let droneOscillators = [];
let droneGainNode = null;

function ensureCtx() {
  if (!playbackCtx) {
    playbackCtx = new (window.AudioContext || window.webkitAudioContext)();
    const n = 16;
    const real = new Float32Array(n);
    const imag = new Float32Array(n);
    const amps = [0, 1, 0.55, 0.75, 0.35, 0.45, 0.22, 0.30, 0.15, 0.20, 0.10, 0.13, 0.07, 0.09, 0.05, 0.06];
    for (let i = 1; i < n; i++) real[i] = amps[i];
    sharedWave = playbackCtx.createPeriodicWave(real, imag, { disableNormalization: false });
  }
  if (playbackCtx.state === 'suspended') playbackCtx.resume();
}

function makeNoiseBurst(freq, dur, gainLevel) {
  const now = playbackCtx.currentTime;
  const buf = playbackCtx.createBuffer(1, playbackCtx.sampleRate * dur, playbackCtx.sampleRate);
  const nd = buf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = (Math.random() * 2 - 1);
  const src = playbackCtx.createBufferSource();
  src.buffer = buf;
  const filt = playbackCtx.createBiquadFilter();
  filt.type = 'bandpass';
  filt.frequency.value = freq * 2;
  filt.Q.value = 1.2;
  const g = playbackCtx.createGain();
  g.gain.setValueAtTime(gainLevel, now);
  g.gain.linearRampToValueAtTime(0, now + dur);
  src.connect(filt).connect(g);
  src.start();
  return g;
}

// --- Harmonium: warm double-reed chorusing bellows tone ---
function harmoniumOn(midi, freq) {
  const now = playbackCtx.currentTime;
  const master = playbackCtx.createGain();
  master.gain.setValueAtTime(0, now);
  master.gain.linearRampToValueAtTime(0.24, now + 0.08); // slow build like bellows pumping
  master.connect(playbackCtx.destination);

  // Tremolo & vibrato LFO (bellows pressure simulation)
  const bellowsLfo = playbackCtx.createOscillator();
  bellowsLfo.frequency.setValueAtTime(5.5, now); // 5.5 Hz vibrato
  const bellowsGain = playbackCtx.createGain();
  bellowsGain.gain.setValueAtTime(0.02, now);
  bellowsLfo.connect(bellowsGain).connect(master.gain);
  bellowsLfo.start(now);

  const filter = playbackCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(freq * 5, now);
  filter.Q.value = 1.0;
  filter.connect(master);

  const oscs = [];

  // Bank 1: Middle Reed (Sawtooth + Triangle)
  const osc1a = playbackCtx.createOscillator();
  osc1a.type = 'sawtooth';
  osc1a.frequency.setValueAtTime(freq * 1.002, now);
  
  const osc1b = playbackCtx.createOscillator();
  osc1b.type = 'triangle';
  osc1b.frequency.setValueAtTime(freq * 0.998, now);

  // Bank 2: Octave Reed (Sawtooth + Triangle)
  const osc2a = playbackCtx.createOscillator();
  osc2a.type = 'sawtooth';
  osc2a.frequency.setValueAtTime(freq * 2.001, now);
  
  const osc2b = playbackCtx.createOscillator();
  osc2b.type = 'triangle';
  osc2b.frequency.setValueAtTime(freq * 1.999, now);

  const g1 = playbackCtx.createGain();
  g1.gain.value = 0.5;
  const g2 = playbackCtx.createGain();
  g2.gain.value = 0.35;

  osc1a.connect(g1); osc1b.connect(g1);
  osc2a.connect(g2); osc2b.connect(g2);

  g1.connect(filter);
  g2.connect(filter);

  osc1a.start(now); osc1b.start(now);
  osc2a.start(now); osc2b.start(now);

  oscs.push(osc1a, osc1b, osc2a, osc2b, bellowsLfo);

  // Bellows key onset chuff
  const noiseGain = makeNoiseBurst(freq, 0.12, 0.05);
  noiseGain.connect(master);

  activeVoices[midi] = { oscs, master, type: 'harmonium' };
}

function harmoniumOff(midi) {
  const v = activeVoices[midi];
  if (!v) return;
  const now = playbackCtx.currentTime;
  v.master.gain.cancelScheduledValues(now);
  v.master.gain.setValueAtTime(v.master.gain.value, now);
  v.master.gain.linearRampToValueAtTime(0, now + 0.18);
  v.oscs.forEach(o => { try { o.stop(now + 0.22); } catch (e) {} });
  delete activeVoices[midi];
}

// --- Piano: realistic hammer strike, stretched harmonics and decay rates ---
function pianoOn(midi, freq) {
  const now = playbackCtx.currentTime;
  const master = playbackCtx.createGain();
  master.gain.setValueAtTime(0, now);
  master.gain.linearRampToValueAtTime(0.6, now + 0.005); // hammer strike
  master.connect(playbackCtx.destination);

  const filter = playbackCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(freq * 8, now);
  filter.frequency.exponentialRampToValueAtTime(freq * 2, now + 1.5);
  filter.connect(master);

  const oscs = [];
  // 5 harmonics with realistic piano string decay times
  const harmonics = [
    { ratio: 1.000, type: 'triangle', amp: 1.0, decay: 3.5 },
    { ratio: 2.001, type: 'triangle', amp: 0.5, decay: 1.8 },
    { ratio: 3.003, type: 'triangle', amp: 0.25, decay: 0.9 },
    { ratio: 4.006, type: 'triangle', amp: 0.15, decay: 0.4 },
    { ratio: 5.010, type: 'triangle', amp: 0.08, decay: 0.2 },
  ];

  harmonics.forEach(h => {
    const osc = playbackCtx.createOscillator();
    osc.type = h.type;
    osc.frequency.setValueAtTime(freq * h.ratio, now);
    
    const g = playbackCtx.createGain();
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(h.amp, now + 0.005);
    g.gain.exponentialRampToValueAtTime(0.001, now + h.decay);
    
    osc.connect(g).connect(filter);
    osc.start(now);
    oscs.push(osc);
  });

  // Hammer noise transient
  const noiseGain = makeNoiseBurst(freq, 0.04, 0.2);
  noiseGain.connect(master);

  activeVoices[midi] = { oscs, master, type: 'piano', startedAt: now };
}

function pianoOff(midi) {
  const v = activeVoices[midi];
  if (!v) return;
  const now = playbackCtx.currentTime;
  v.master.gain.cancelScheduledValues(now);
  v.master.gain.setValueAtTime(v.master.gain.value, now);
  v.master.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
  v.oscs.forEach(o => { try { o.stop(now + 0.4); } catch (e) {} });
  delete activeVoices[midi];
}

// --- Tanpura: dynamic Jivari filter sweep and rich resonant harmonics ---
function tanpuraOn(midi, freq, opts) {
  opts = opts || {};
  const pluckIntervalMs = opts.pluckIntervalMs || 1200;
  const volumeScale = opts.volumeScale !== undefined ? opts.volumeScale : 1;
  const now = playbackCtx.currentTime;

  const master = playbackCtx.createGain();
  master.gain.setValueAtTime(0, now);
  master.gain.linearRampToValueAtTime(0.28 * volumeScale, now + 0.1);
  master.connect(playbackCtx.destination);

  const filter = playbackCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(6000, now);
  filter.frequency.exponentialRampToValueAtTime(800, now + 1.5);
  filter.Q.value = 2.0; // resonance for Jivari buzz
  filter.connect(master);

  const oscs = [];
  const harmonics = [
    { ratio: 1.000, type: 'sawtooth', amp: 0.6 },
    { ratio: 2.000, type: 'sawtooth', amp: 0.3 },
    { ratio: 3.000, type: 'sine',     amp: 0.15 },
    { ratio: 4.000, type: 'sawtooth', amp: 0.1 },
    { ratio: 5.001, type: 'sine',     amp: 0.08 },
    { ratio: 6.002, type: 'sine',     amp: 0.05 },
    { ratio: 0.500, type: 'triangle', amp: 0.15 }
  ];

  harmonics.forEach(h => {
    const osc = playbackCtx.createOscillator();
    osc.type = h.type;
    const detune = 1 + (Math.random() - 0.5) * 0.003;
    osc.frequency.setValueAtTime(freq * h.ratio * detune, now);
    
    const g = playbackCtx.createGain();
    g.gain.setValueAtTime(h.amp, now);
    
    // Slight vibrato for string movement
    const vibrato = playbackCtx.createOscillator();
    vibrato.frequency.setValueAtTime(6 + Math.random() * 2, now);
    const vGain = playbackCtx.createGain();
    vGain.gain.setValueAtTime(1.5, now);
    vibrato.connect(vGain).connect(osc.frequency);
    vibrato.start(now);
    
    osc.connect(g).connect(filter);
    osc.start(now);
    oscs.push(osc, vibrato);
  });

  const noiseGain = makeNoiseBurst(freq, 0.05, 0.12);
  noiseGain.connect(master);

  const pluckInterval = setInterval(() => {
    const t = playbackCtx.currentTime;
    master.gain.cancelScheduledValues(t);
    master.gain.setValueAtTime(master.gain.value, t);
    master.gain.linearRampToValueAtTime(0.28 * volumeScale, t + 0.08);
    master.gain.exponentialRampToValueAtTime(0.12 * volumeScale, t + 1.0);

    filter.frequency.cancelScheduledValues(t);
    filter.frequency.setValueAtTime(6000, t);
    filter.frequency.exponentialRampToValueAtTime(800, t + 1.5);
  }, pluckIntervalMs);

  activeVoices[midi] = { oscs, master, type: 'tanpura', pluckInterval };
}
function tanpuraOff(midi) {
  const v = activeVoices[midi];
  if (!v) return;
  const now = playbackCtx.currentTime;
  clearInterval(v.pluckInterval);
  v.master.gain.cancelScheduledValues(now);
  v.master.gain.setValueAtTime(v.master.gain.value, now);
  v.master.gain.linearRampToValueAtTime(0, now + 1.2);
  v.oscs.forEach(o => { try { o.stop(now + 1.3); } catch (e) {} });
  delete activeVoices[midi];
}
function noteOn(midi) {
  ensureCtx();
  if (activeVoices[midi]) return;
  const freq = midiToFreq(midi);
  if (currentInstrument === 'piano') pianoOn(midi, freq);
  else if (currentInstrument === 'tanpura') tanpuraOn(midi, freq);
  else harmoniumOn(midi, freq);
}
function noteOff(midi) {
  const v = activeVoices[midi];
  if (!v) return;
  if (v.type === 'piano') pianoOff(midi);
  else if (v.type === 'tanpura') tanpuraOff(midi);
  else harmoniumOff(midi);
}

function startTanpuraDrone() {
  ensureCtx();
  stopTanpuraDrone();
  const mode = droneModeSelect.value;
  const fineTuneCents = parseFloat(tanpuraFineTuneSlider.value) || 0;
  const volumeScale = (parseFloat(tanpuraVolumeSlider.value) || 70) / 100;
  const addPa = droneSaPaCheck.checked;
  
  // Reference Sa in octave 3 for warm drone: 48 + tonicOffset
  const saMidi = 48 + tonicOffset; 
  const freq = midiToFreq(saMidi) * Math.pow(2, fineTuneCents / 1200);
  const paFreq = freq * 1.5;

  tanpuraPlaying = true;
  droneOscillators = [];

  const now = playbackCtx.currentTime;
  droneGainNode = playbackCtx.createGain();
  droneGainNode.gain.setValueAtTime(0.001, now);
  droneGainNode.gain.exponentialRampToValueAtTime(0.24 * volumeScale, now + 0.3);
  droneGainNode.connect(playbackCtx.destination);

  if (mode === 'simple') {
    const o = playbackCtx.createOscillator();
    o.type = 'triangle';
    o.frequency.setValueAtTime(freq, now);
    o.connect(droneGainNode);
    o.start(now);
    droneOscillators.push(o);
    if (addPa) {
      const o2 = playbackCtx.createOscillator();
      o2.type = 'triangle';
      o2.frequency.setValueAtTime(paFreq, now);
      const g2 = playbackCtx.createGain();
      g2.gain.value = 0.7;
      o2.connect(g2).connect(droneGainNode);
      o2.start(now);
      droneOscillators.push(o2);
    }
  } else if (mode === 'tanpura') {
    // Additive Tanpura synthesis from Metronome
    const harmonics = [
      { ratio: 1, type: 'sine', vol: 0.5 },
      { ratio: 2, type: 'sine', vol: 0.2 },
      { ratio: 3, type: 'sine', vol: 0.08 },
      { ratio: 1.002, type: 'sine', vol: 0.15 },
      { ratio: 0.998, type: 'sine', vol: 0.12 },
      { ratio: 0.5, type: 'triangle', vol: 0.1 },
    ];
    harmonics.forEach(h => {
      const o = playbackCtx.createOscillator();
      o.type = h.type;
      o.frequency.setValueAtTime(freq * h.ratio, now);
      const g = playbackCtx.createGain();
      g.gain.value = h.vol;
      o.connect(g).connect(droneGainNode);
      o.start(now);
      droneOscillators.push(o);
    });
    if (addPa) {
      [1, 1.003, 2].forEach((r, i) => {
        const o = playbackCtx.createOscillator();
        o.type = 'sine';
        o.frequency.setValueAtTime(paFreq * r, now);
        const g = playbackCtx.createGain();
        g.gain.value = i === 0 ? 0.35 : 0.08;
        o.connect(g).connect(droneGainNode);
        o.start(now);
        droneOscillators.push(o);
      });
    }
  } else if (mode === 'harmonium') {
    // Harmonium drone from Metronome
    const o = playbackCtx.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(freq, now);
    const lpf = playbackCtx.createBiquadFilter();
    lpf.type = 'lowpass';
    lpf.frequency.setValueAtTime(freq * 4, now);
    lpf.Q.value = 0.5;
    o.connect(lpf).connect(droneGainNode);
    o.start(now);
    droneOscillators.push(o);

    const o2 = playbackCtx.createOscillator();
    o2.type = 'triangle';
    o2.frequency.setValueAtTime(freq * 0.5, now);
    const g2 = playbackCtx.createGain();
    g2.gain.value = 0.15;
    o2.connect(g2).connect(droneGainNode);
    o2.start(now);
    droneOscillators.push(o2);

    if (addPa) {
      const o3 = playbackCtx.createOscillator();
      o3.type = 'sawtooth';
      o3.frequency.setValueAtTime(paFreq, now);
      const lpf2 = playbackCtx.createBiquadFilter();
      lpf2.type = 'lowpass';
      lpf2.frequency.value = paFreq * 4;
      const g3 = playbackCtx.createGain();
      g3.gain.value = 0.65;
      o3.connect(lpf2).connect(g3).connect(droneGainNode);
      o3.start(now);
      droneOscillators.push(o3);
    }
  }

  tanpuraPlayBtn.textContent = '■ ' + (TRANSLATIONS[currentLang] || TRANSLATIONS.gu).tanpura_stop;
  tanpuraPlayBtn.classList.add('playing');
}

function stopTanpuraDrone() {
  tanpuraTimeouts.forEach(t => clearTimeout(t));
  tanpuraTimeouts = [];
  TANPURA_KEYS.forEach(k => tanpuraOff(k));

  if (droneGainNode) {
    try {
      const now = playbackCtx.currentTime;
      droneGainNode.gain.cancelScheduledValues(now);
      droneGainNode.gain.setValueAtTime(droneGainNode.gain.value, now);
      droneGainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    } catch (e) {}
  }
  const nodesToStop = [...droneOscillators];
  droneOscillators = [];
  setTimeout(() => {
    nodesToStop.forEach(o => { try { o.stop(); } catch(e) {} });
  }, 350);

  tanpuraPlaying = false;
  if (tanpuraPlayBtn) {
    tanpuraPlayBtn.textContent = '▶ ' + (TRANSLATIONS[currentLang] || TRANSLATIONS.gu).tanpura_play;
    tanpuraPlayBtn.classList.remove('playing');
  }
}

// ---------- Pitch detection (improved: lower threshold + octave-error guard) ----------
function autoCorrelate(buf, sampleRate) {
  const SIZE = buf.length;
  let rms = 0;
  for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / SIZE);
  if (rms < 0.0018) return -1; // catches very soft/short notes

  let r1 = 0, r2 = SIZE - 1;
  const thres = 0.2;
  for (let i = 0; i < SIZE / 2; i++) { if (Math.abs(buf[i]) < thres) { r1 = i; break; } }
  for (let i = 1; i < SIZE / 2; i++) { if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; } }

  const trimmed = buf.slice(r1, r2);
  const newSize = trimmed.length;
  const c = new Array(newSize).fill(0);
  for (let i = 0; i < newSize; i++) {
    for (let j = 0; j < newSize - i; j++) c[i] += trimmed[j] * trimmed[j + i];
  }

  let d = 0;
  while (d + 1 < newSize && c[d] > c[d + 1]) d++;
  let maxval = -1, maxpos = -1;
  for (let i = d; i < newSize; i++) if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
  let T0 = maxpos;
  if (T0 <= 0) return -1;

  // parabolic interpolation for sub-sample precision
  const x1 = c[T0 - 1] || 0, x2 = c[T0] || 0, x3 = c[T0 + 1] || 0;
  const a = (x1 + x3 - 2 * x2) / 2;
  const b = (x3 - x1) / 2;
  if (a) T0 = T0 - b / (2 * a);

  let freq = sampleRate / T0;

  // octave-error guard: if correlation at half the period is nearly as strong,
  // the true fundamental is likely double the detected frequency (avoids "an octave low" glitches)
  const halfT = Math.round(T0 / 2);
  if (halfT > 0 && halfT < newSize && c[halfT] > 0.92 * maxval) {
    freq = freq * 2;
  }

  return freq;
}

const trailCtx = trailCanvas.getContext('2d');
let pitchSamples = []; // {x, t}
const TRAIL_LIFETIME = 900; // ms a segment stays visible

function resizeTrailCanvas() {
  trailCanvas.width = trailCanvas.clientWidth * devicePixelRatio;
  trailCanvas.height = trailCanvas.clientHeight * devicePixelRatio;
}
window.addEventListener('resize', resizeTrailCanvas);
resizeTrailCanvas();

function recordTrailSample(midiFloat) {
  const now = performance.now();
  if (midiFloat && midiFloat > 0) {
    const x = midiFloatToX(midiFloat);
    pitchSamples.push({ x, t: now });
  }
  pitchSamples = pitchSamples.filter(s => now - s.t < TRAIL_LIFETIME);
}

function drawTrail() {
  const w = trailCanvas.width, h = trailCanvas.height;
  trailCtx.clearRect(0, 0, w, h);
  const now = performance.now();
  const segW = Math.max(3, (w / totalWidth) * (whiteKeyWidth * 0.35));
  pitchSamples.forEach(s => {
    const age = now - s.t;
    const alpha = Math.max(0, 1 - age / TRAIL_LIFETIME);
    const relX = (s.x / totalWidth) * w;
    trailCtx.fillStyle = `rgba(231, 76, 60, ${alpha * 0.85})`;
    trailCtx.fillRect(relX - segW / 2, 0, segW, h);
  });
}

// ---------- History canvas: continuous scrolling pitch line (jem singingcarrots ma hoy) ----------
const canvas = document.getElementById('historyCanvas');
const ctx = canvas.getContext('2d');
const HISTORY_SCROLL_SPEED = 55; // px/sec — line niche khasti jay tenu speed
const SILENCE_GAP_MS = 150; // aatla thi vadhare gap hoy to line todi nakhvi (break)

let pitchHistoryPoints = []; // {x, t} exact continuous position, t in ms
let lastValidSoundTime = 0;

function resizeCanvas() {
  canvas.width = canvas.clientWidth * devicePixelRatio;
  canvas.height = canvas.clientHeight * devicePixelRatio;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function registerPitchForHistory(midiFloat) {
  const now = performance.now();
  if (midiFloat && midiFloat > 0) {
    lastValidSoundTime = now;
    const x = midiFloatToX(midiFloat); // exact non-quantized position (real cents precision)
    pitchHistoryPoints.push({ x, t: now, gap: false });
  } else if (pitchHistoryPoints.length && (now - lastValidSoundTime) < SILENCE_GAP_MS + 20) {
    // mark a tiny gap marker so the line breaks cleanly on real silence
  }
  const maxAgeMs = ((canvas.height / devicePixelRatio) / HISTORY_SCROLL_SPEED) * 1000 + 500;
  pitchHistoryPoints = pitchHistoryPoints.filter(p => (now - p.t) < maxAgeMs);
}

function drawHistory() {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  const now = performance.now();

  // faint scrolling grid for depth reference
  const offset = ((now / 1000) * HISTORY_SCROLL_SPEED * devicePixelRatio) % 40;
  ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--grid-line').trim() || '#e4e4e2';
  ctx.lineWidth = 1;
  for (let y = -40; y < h + 40; y += 40) {
    const yy = y + offset;
    ctx.beginPath();
    ctx.moveTo(0, yy);
    ctx.lineTo(w, yy);
    ctx.stroke();
  }

  if (pitchHistoryPoints.length < 2) return;

  ctx.strokeStyle = '#e74c3c';
  ctx.lineWidth = 3 * devicePixelRatio;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  let drawing = false;
  for (let i = 0; i < pitchHistoryPoints.length; i++) {
    const p = pitchHistoryPoints[i];
    const age = (now - p.t) / 1000;
    const y = age * HISTORY_SCROLL_SPEED * devicePixelRatio;
    const x = (p.x / totalWidth) * w;
    const prev = pitchHistoryPoints[i - 1];
    const timeSincePrev = prev ? (p.t - prev.t) : 0;

    if (!prev || timeSincePrev > SILENCE_GAP_MS) {
      if (drawing) ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, y);
      drawing = true;
    } else {
      ctx.lineTo(x, y);
    }
  }
  if (drawing) ctx.stroke();
}

function updateUI(freq) {
  const pianoMarker = document.getElementById('pianoMarker');
  if (freq < 0 || freq > 1600 || freq < 60) {
    noteBig.textContent = '-';
    needle.style.left = '50%';
    if (pianoMarker) pianoMarker.style.display = 'none';
    registerPitchForHistory(0);
    drawHistory();
    recordTrailSample(0);
    drawTrail();
    return;
  }
  const midiFloat = freqToMidiFloat(freq);
  const rounded = Math.round(midiFloat);
  const cents = Math.round((midiFloat - rounded) * 100);
  noteBig.textContent = sargamDisplayString(midiFloat) + ' / ' + noteName(midiFloat) + '  (' + freq.toFixed(0) + ' Hz, ' + (cents > 0 ? '+' : '') + cents + '¢)';

  const clamped = Math.max(-50, Math.min(50, cents));
  needle.style.left = (50 + clamped) + '%';

  if (pianoMarker) {
    const xPix = midiFloatToX(midiFloat);
    pianoMarker.style.display = 'block';
    pianoMarker.style.left = xPix + 'px';
  }

  registerPitchForHistory(midiFloat);
  drawHistory();
  recordTrailSample(midiFloat);
  drawTrail();
}

function loop() {
  try {
    analyser.getFloatTimeDomainData(dataArray);
    const freq = autoCorrelate(dataArray, audioContext.sampleRate);
    updateUI(freq);
  } catch (err) {
    // never let a rendering/detection glitch kill the whole live loop
    console.error('pitch-loop error (recovered):', err);
  }
  rafId = requestAnimationFrame(loop);
}

// ---------- Screen Wake Lock — jethi app khullu hoy tyare screen band na thay ----------
let wakeLockSentinel = null;

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLockSentinel = await navigator.wakeLock.request('screen');
      wakeLockSentinel.addEventListener('release', () => {
        wakeLockSentinel = null;
      });
    }
  } catch (err) {
    // wake lock not supported or denied — silently ignore, app still works
    console.warn('Wake lock unavailable:', err);
  }
}

function releaseWakeLock() {
  if (wakeLockSentinel) {
    wakeLockSentinel.release().catch(() => {});
    wakeLockSentinel = null;
  }
}

// re-acquire wake lock if tab becomes visible again while still listening
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && listening && !wakeLockSentinel) {
    requestWakeLock();
  }
});

async function startListening() {
  try {
    statusEl.textContent = 'Mic access mangyu che...';
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: true
      }
    });
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioContext.createMediaStreamSource(mediaStream);

    const boost = audioContext.createGain();
    boost.gain.value = 3.5; // amplify quiet voices before detection

    analyser = audioContext.createAnalyser();
    analyser.fftSize = 2048;
    dataArray = new Float32Array(analyser.fftSize);
    source.connect(boost);
    boost.connect(analyser);

    startBtn.textContent = (TRANSLATIONS[currentLang] || TRANSLATIONS.gu).stop_listening;
    startBtn.classList.add('listening');
    statusEl.textContent = 'Listening... gaao!';
    listening = true;
    loop();
    requestWakeLock();
  } catch (err) {
    if (location.protocol === 'file:') {
      statusEl.textContent = 'Mic kaam nahi karshe - aa file direct kholi chhe (file://). Netlify Drop par upload karo pehla.';
    } else {
      statusEl.textContent = 'Mic access nathi malyu. Browser permission check karo.';
    }
  }
}

function stopListening() {
  if (rafId) cancelAnimationFrame(rafId);
  if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
  if (audioContext) audioContext.close();
  listening = false;
  startBtn.textContent = (TRANSLATIONS[currentLang] || TRANSLATIONS.gu).start_listening;
  startBtn.classList.remove('listening');
  statusEl.textContent = 'Mic access જરૂરી છે — "Start Listening" દબાવો';
  noteBig.textContent = '-';
  const pianoMarker = document.getElementById('pianoMarker');
  if (pianoMarker) pianoMarker.style.display = 'none';
  pitchSamples = [];
  pitchHistoryPoints = [];
  drawHistory();
  drawTrail();
  releaseWakeLock();
}

startBtn.addEventListener('click', () => {
  if (listening) stopListening();
  else startListening();
});

drawHistory();
drawTrail();

    { title: '🎤 Welcome to Harmony Music', body: 'This is a free Vocal Pitch Monitor — sing, and the app shows your pitch live on a piano keyboard. Sargam (Sa Re Ga Ma) notation, harmonium/piano/tanpura sounds, and more — this short guide covers it all.' },
    { title: 'Choose your Sa', body: 'Use the "Choose your Sa" dropdown with harmonium-style (white/black key) numbering to set your Sa. All swar names (Sa Re Ga...) shift automatically to match.' },
    { title: 'Choose an Instrument', body: 'Pick Harmonium, Piano, or Tanpura. Harmonium has a fixed 3-saptak range (C2-C4), Piano shows the full 88-key range, and Tanpura replaces the keyboard with drone-tuning controls.' },
    { title: 'Piano Keyboard & Sargam', body: 'Each key shows its swar name (Sa/Re/Ga) below it. Komal swars get an underline, tivra Ma is marked "Ma\u2019". A dot below marks mandra saptak, a dot above marks taar saptak.' },
    { title: 'Sing into the Mic', body: 'Press "Start Listening", allow mic access, then sing — a red marker line on the piano shows your exact pitch, and the history graph below traces your pitch movement as a wavy line.' },
    { title: 'Tanpura Drone', body: 'In Tanpura mode, set the Tuning (Pa/Ma/Ni-Sa-Sa-Sa), Fine Tune, Pluck Speed, and Volume, then press "Start Tanpura" — a continuous background drone plays until you stop it.' },
    { title: 'Top Buttons', body: '🎨 Theme (Light/Dark), 🌐 Language (Gujarati/Hindi/English), 🔄 Rotate (landscape/portrait), ⬇️ Install (add app to home screen). This "ℹ️" button brings back this guide anytime.' }
  ]
};

let onboardingStepIndex = 0;
const onboardingOverlay = document.getElementById('onboardingOverlay');
const onboardingTitle = document.getElementById('onboardingTitle');
const onboardingBody = document.getElementById('onboardingBody');
const onboardingStepNum = document.getElementById('onboardingStepNum');
const onboardingPrev = document.getElementById('onboardingPrev');
const onboardingNext = document.getElementById('onboardingNext');
const onboardingSkip = document.getElementById('onboardingSkip');
const onboardingClose = document.getElementById('onboardingClose');
const SKIP_LABEL = { gu: 'પૂરું કરો', hi: 'समाप्त करें', en: 'Done' };
const NEXT_LABEL_LAST = { gu: 'પૂરું', hi: 'समाप्त', en: 'Done' };

function renderOnboardingStep() {
  const steps = ONBOARDING_STEPS[currentLang] || ONBOARDING_STEPS.gu;
  const step = steps[onboardingStepIndex];
  onboardingTitle.textContent = step.title;
  onboardingBody.textContent = step.body;
  onboardingStepNum.textContent = (onboardingStepIndex + 1) + ' / ' + steps.length;
  onboardingPrev.style.visibility = onboardingStepIndex === 0 ? 'hidden' : 'visible';
  onboardingSkip.textContent = (SKIP_LABEL[currentLang] || SKIP_LABEL.gu);
  onboardingNext.textContent = onboardingStepIndex === steps.length - 1 ? '✓' : '›';
}

function openOnboarding(fromStart) {
  onboardingStepIndex = fromStart ? 0 : onboardingStepIndex;
  renderOnboardingStep();
  onboardingOverlay.style.display = 'flex';
}

function closeOnboarding() {
  onboardingOverlay.style.display = 'none';
  try { localStorage.setItem('harmonyAppOnboarded', '1'); } catch (e) {}
}

onboardingNext.addEventListener('click', () => {
  const steps = ONBOARDING_STEPS[currentLang] || ONBOARDING_STEPS.gu;
  if (onboardingStepIndex < steps.length - 1) {
    onboardingStepIndex++;
    renderOnboardingStep();
  } else {
    closeOnboarding();
  }
});
onboardingPrev.addEventListener('click', () => {
  if (onboardingStepIndex > 0) {
    onboardingStepIndex--;
    renderOnboardingStep();
  }
});
onboardingSkip.addEventListener('click', closeOnboarding);
onboardingClose.addEventListener('click', closeOnboarding);



const SARGAM_BASE_BY_LANG = {
  gu: ['સા','રે કો','રે','ગ કો','ગ','મ','મ','પા','ધ કો','ધ','ની કો','ની'],
  hi: ['सा','रे को','रे','ग को','ग','म','म','पा','ध को','ध','नी को','नी'],
  en: ['Sa','Re(k)','Re','Ga(k)','Ga','Ma','Ma','Pa','Dha(k)','Dha','Ni(k)','Ni']
};

let currentLang = (() => {
  try { return localStorage.getItem('harmonyAppLang') || 'gu'; } catch (e) { return 'gu'; }
})();

function applyTranslations() {
  const dict = TRANSLATIONS[currentLang] || TRANSLATIONS.gu;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (dict[key] !== undefined) el.textContent = dict[key];
  });
  // dynamic-state buttons that aren't plain data-i18n (depend on runtime state)
  if (typeof listening !== 'undefined') {
    startBtn.textContent = listening ? dict.stop_listening : dict.start_listening;
  }
  if (typeof tanpuraPlaying !== 'undefined' && tanpuraPlayBtn) {
    tanpuraPlayBtn.innerHTML = '▶ <span>' + (tanpuraPlaying ? dict.tanpura_stop : dict.tanpura_play) + '</span>';
  }
  SARGAM_BASE.splice(0, SARGAM_BASE.length, ...(SARGAM_BASE_BY_LANG[currentLang] || SARGAM_BASE_BY_LANG.gu));
  if (typeof buildPiano === 'function' && piano) buildPiano();
  document.documentElement.lang = currentLang;
  if (typeof onboardingOverlay !== 'undefined' && onboardingOverlay && onboardingOverlay.style.display === 'flex') {
    renderOnboardingStep();
  }
}

// Theme and language are managed globally by app-shell.js



// apply saved language/theme once DOM + all functions are ready
applyTranslations();

// auto-show onboarding only on the very first visit (placed here so currentLang/translations are ready)
(() => {
  let alreadyOnboarded = false;
  try { alreadyOnboarded = localStorage.getItem('harmonyAppOnboarded') === '1'; } catch (e) {}
  if (!alreadyOnboarded) openOnboarding(true);
})();



// ---------- PWA Install button ----------
let deferredInstallPrompt = null;
const installBtn = document.getElementById('installBtn');
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

function hideInstallBtn() {
  installBtn.style.display = 'none';
}

function showInstallBtnIfNeeded() {
  // isStandalone is checked live every time — never gets permanently "stuck" hidden across deploys/devices
  installBtn.style.display = isStandalone ? 'none' : 'block';
}

// show immediately on load (don't wait for beforeinstallprompt — some browsers delay/never fire it)
showInstallBtnIfNeeded();

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  showInstallBtnIfNeeded();
});

installBtn.addEventListener('click', async () => {
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    const choice = await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    if (choice && choice.outcome === 'accepted') hideInstallBtn();
  } else if (isIOS) {
    alert('iPhone/iPad par install karva mate: niche Share button (⬆️) dabao, pachi "Add to Home Screen" select karo.');
  } else {
    alert('Aa browser ma direct install available nathi. Chrome address bar ma install icon (⊕) check karo, ke browser menu ma "Add to Home screen" shodho.');
  }
});

window.addEventListener('appinstalled', () => {
  hideInstallBtn();
});

// if opened as an already-installed standalone app, never show the button
if (isStandalone) hideInstallBtn();
</script>

<script>
  const INFO_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-info" style="pointer-events:none;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`;
  const ROTATE_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-rotate-cw" style="pointer-events:none;"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>`;

  initAppShell({
    title: document.querySelector('h1') ? document.querySelector('h1').textContent : 'Vocal Pitch Monitor',
    customHeaderButtons: [
      { id: 'infoBtn', title: 'Info', html: INFO_SVG },
      { id: 'rotateBtn', title: 'Rotate', html: ROTATE_SVG }
    ]
  });

  // Bind info and rotate event listeners dynamically after shell elements are built
  const infoBtn = document.getElementById('infoBtn');
  if (infoBtn) {
    infoBtn.addEventListener('click', () => openOnboarding(true));
  }

  const rotateBtn = document.getElementById('rotateBtn');
  if (rotateBtn) {
    rotateBtn.addEventListener('click', async () => {
      const dict = TRANSLATIONS[currentLang] || TRANSLATIONS.gu;
      try {
        if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
          try { await document.documentElement.requestFullscreen(); } catch (fsErr) { /* ignore */ }
        }
        if (screen.orientation && screen.orientation.lock) {
          const isLandscape = (screen.orientation.type || '').includes('landscape');
          await screen.orientation.lock(isLandscape ? 'portrait' : 'landscape');
        } else {
          throw new Error('orientation lock unsupported');
        }
      } catch (err) {
        if (isStandalone) {
          alert(dict.rotate_fail_installed || 'Rotate feature aa device par kaam nathi karta. Phone na "Auto-rotate" setting ON rakho ane phone ne haath thi tirchu karo.');
        } else {
          alert(dict.rotate_fail_browser || 'Chrome browser tab ma rotate lock kaam nathi kartu (browser ni limitation chhe). Aa app ne pehla "Install" karo — install kareli app ma rotate barabar kaam karse. Tyar sudhi phone na "Auto-rotate" ON rakhi ne haath thi tirchu karo.');
        }
      }
    });
  }
</script>
