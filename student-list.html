<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student List - Harmony Music</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="shared/theme.css">
<link rel="stylesheet" href="shared/app-shell.css">
<style>
  .student-container {
    background: linear-gradient(135deg, #1e272c 0%, #0f1315 100%);
    border: 8px solid #07090a;
    border-radius: 24px;
    padding: 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    margin-top: 10px;
    color: #f7e6d5;
  }
  .search-wrap {
    position: relative;
    margin-bottom: 20px;
  }
  .search-wrap input {
    width: 100%;
    padding: 12px 16px 12px 42px;
    border-radius: 14px;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 0.9rem;
    outline: none;
  }
  .search-icon {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    color: var(--subtitle);
  }
  .student-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .student-card {
    background: rgba(255,255,255,0.03);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: transform 0.2s;
  }
  .student-card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  .student-avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    font-weight: 800;
  }
  .student-info {
    flex: 1;
    min-width: 0;
  }
  .student-name {
    font-weight: 700;
    font-size: 0.95rem;
    margin: 0 0 2px;
  }
  .student-inst {
    font-size: 0.75rem;
    color: var(--subtitle);
    margin-bottom: 6px;
  }
  .badge-row {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }
  .level-badge {
    font-size: 0.6rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 6px;
    text-transform: uppercase;
  }
  .level-badge.beg { background: rgba(52, 152, 219, 0.15); color: #3498db; }
  .level-badge.int { background: rgba(241, 196, 15, 0.15); color: #f1c40f; }
  .level-badge.adv { background: rgba(46, 204, 113, 0.15); color: #2ecc71; }
  
  .streak-badge {
    font-size: 0.65rem;
    font-weight: 700;
    color: #e67e22;
  }
</style>
</head>
<body data-page="attendance">
  <div id="appShellRoot"></div>
  <div id="pageBody" style="display:none;">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:15px;">
      <h2 id="lblTitle" style="margin:0;">🧑‍🎓 Student Directory</h2>
      <a href="dashboard.html" id="btnBack" class="ctrl-btn" style="text-decoration:none; padding:8px 16px; font-size:0.8rem; font-weight:600; border-radius:12px; background:var(--border);">← Back</a>
    </div>

    <div class="student-container">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="search" id="studentSearch" placeholder="Search students..." autocomplete="off">
      </div>

      <div class="student-grid" id="studentGrid"></div>
    </div>
  </div>

<script src="shared/utils.js"></script>
<script src="shared/supabase-client.js"></script>
<script src="shared/app-shell.js"></script>
<script>
(function(){
  const lang = (() => { try { return localStorage.getItem('harmonyAppLang') || 'gu'; } catch(e) { return 'gu'; } })();

  const TEXT = {
    gu: {
      title: '🧑‍🎓 વિદ્યાર્થીઓની યાદી',
      back: '← પાછા જાઓ',
      search: 'વિદ્યાર્થી શોધો...',
      streak: 'દિવસો રિયાઝ ક્રમ',
      levels: { beg: 'પ્રારંભિક', int: 'મધ્યમ', adv: 'ઉચ્ચ' }
    },
    hi: {
      title: '🧑‍🎓 छात्र सूची',
      back: '← वापस जाएं',
      search: 'छात्र खोजें...',
      streak: 'दिनों का रियाज़',
      levels: { beg: 'प्रारंभिक', int: 'मध्यम', adv: 'उच्च' }
    },
    en: {
      title: '🧑‍🎓 Student Directory',
      back: '← Go Back',
      search: 'Search students...',
      streak: 'Days Riyaz Streak',
      levels: { beg: 'Beginner', int: 'Intermediate', adv: 'Advanced' }
    }
  };

  const t = TEXT[lang] || TEXT.gu;

  document.getElementById('lblTitle').textContent = t.title;
  document.getElementById('btnBack').textContent = t.back;
  document.getElementById('studentSearch').placeholder = t.search;

  const students = [
    { name: 'Aarav Patel', inst: 'Tabla (તબલા)', level: 'beg', streak: 12 },
    { name: 'Kavya Sharma', inst: 'Harmonium (હાર્મોનિયમ)', level: 'int', streak: 24 },
    { name: 'Dev Shah', inst: 'Santoor (સંતૂર)', level: 'adv', streak: 35 },
    { name: 'Ishita Mehta', inst: 'Grand Piano (પિયાનો)', level: 'beg', streak: 8 },
    { name: 'Rohan Joshi', inst: 'Flute (વાંસળી)', level: 'int', streak: 15 },
    { name: 'Diya Trivedi', inst: 'Guitar (ગિટાર)', level: 'adv', streak: 42 }
  ];

  function render(query = '') {
    const grid = document.getElementById('studentGrid');
    grid.innerHTML = '';

    const filtered = students.filter(s => 
      s.name.toLowerCase().includes(query.toLowerCase()) ||
      s.inst.toLowerCase().includes(query.toLowerCase())
    );

    filtered.forEach(s => {
      const card = document.createElement('div');
      card.className = 'student-card';

      const initial = s.name.charAt(0);
      const levelText = t.levels[s.level] || s.level;

      card.innerHTML = `
        <div class="student-avatar" style="background: hsl(${initial.charCodeAt(0) * 15 % 360}, 60%, 40%);">${initial}</div>
        <div class="student-info">
          <h4 class="student-name">${s.name}</h4>
          <div class="student-inst">${s.inst}</div>
          <div class="badge-row">
            <span class="level-badge ${s.level}">${levelText}</span>
            <span class="streak-badge">🔥 ${s.streak} ${t.streak}</span>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  document.getElementById('studentSearch').oninput = function() {
    render(this.value.trim());
  };

  render();
  initAppShell({ title: t.title });
})();
</script>
</body>
</html>
