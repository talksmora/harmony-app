<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>હાર્મોની મ્યુઝિક — સેલ્ફ પ્રોગ્રેસ કાર્ડ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/theme.css">
<style>
  :root {
    --ink: var(--text);
    --parchment: var(--bg);
    --parchment-deep: var(--bg);
    --card-bg: var(--surface);
    --maroon: var(--progress-accent);
    --maroon-deep: var(--progress-accent-deep);
    --brass: var(--progress-brass);
    --brass-bright: var(--progress-brass-bright);
    --sitar-green: var(--progress-green);
    --line: var(--border);
    --shadow: var(--shadow);
    --star-empty: var(--star-empty);
    --star-empty-sub: var(--star-empty-sub);
    --muted: var(--muted);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--bg);
    font-family: 'Segoe UI', 'Noto Sans Gujarati', sans-serif;
    color: var(--text);
    min-height:100vh;
    padding-bottom:60px;
    transition:background .3s ease, color .3s ease;
  }
  .theme-toggle{
    position:fixed; top:14px; right:14px; z-index:50;
    width:42px; height:42px; border-radius:50%;
    background:var(--card-bg); border:1.5px solid var(--brass);
    display:flex; align-items:center; justify-content:center;
    font-size:18px; cursor:pointer; box-shadow:var(--shadow);
  }
  .back-link{
    position:fixed; top:18px; left:14px; z-index:50;
    background:var(--card-bg); border:1.5px solid var(--brass);
    border-radius:20px; padding:8px 14px; font-size:12.5px; font-weight:700;
    color:var(--maroon-deep); text-decoration:none; box-shadow:var(--shadow);
  }
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 0;}

  .setup{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
    margin-top:8px;
    box-shadow:var(--shadow);
  }
  .setup label{display:block; font-size:12.5px; font-weight:600; color:var(--text); margin-bottom:4px;}
  .setup .row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .setup input, .setup select{
    width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line);
    background:var(--bg); font-family:inherit; font-size:15px; color:var(--text);
  }
  .setup input:focus, .setup select:focus{outline:2px solid var(--accent); outline-offset:1px;}

  .dial-section{
    margin-top:18px;
    display:flex; align-items:center; gap:18px;
    background:var(--card-bg); border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:var(--shadow);
  }
  .dial{
    width:92px; height:92px; flex:0 0 auto; position:relative;
  }
  .dial svg{width:100%; height:100%; transform:rotate(-90deg); display:block;}
  .dial-track{fill:none; stroke:var(--bg); stroke-width:9;}
  .dial-progress{
    fill:none; stroke:var(--accent-gold); stroke-width:9; stroke-linecap:round;
    transition:stroke-dashoffset 0.4s ease, stroke 0.3s ease;
  }
  .dial span{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Segoe UI', sans-serif; font-weight:700; font-size:17px; color:var(--text);
  }
  .dial-meta{flex:1;}
  .dial-meta .tot{font-size:13.5px; color:var(--text); font-weight:600;}
  .dial-meta .grade{font-size:12px; color:var(--subtitle); margin-top:2px;}

  .criteria{margin-top:20px;}
  .crit-card{
    background:var(--card-bg); border:1px solid var(--line); border-radius:16px;
    padding:14px 14px 10px; margin-bottom:12px; box-shadow:var(--shadow);
  }
  .crit-head{display:flex; align-items:baseline; gap:8px; margin-bottom:8px;}
  .crit-num{
    font-family:'Segoe UI', sans-serif; font-weight:700; color:var(--accent); font-size:14px; flex:0 0 auto;
  }
  .crit-title{font-weight:600; font-size:15px; color:var(--text);}

  .stars{display:flex; gap:6px; margin:6px 0 8px;}
  .star-btn{
    flex:1; min-width:0;
    border:1.5px solid var(--line); background:var(--bg);
    border-radius:10px; padding:8px 4px; cursor:pointer;
    text-align:center; font-size:16px; color:var(--subtitle);
    transition:all .15s ease;
    font-family:inherit;
  }
  .star-btn .n{display:block; font-size:10px; margin-top:2px; color:var(--subtitle);}
  .star-btn.selected{
    background:linear-gradient(160deg, var(--accent-gold), #f39c12);
    border-color:var(--accent-gold);
    color:#2c3e50;
    box-shadow:0 3px 10px rgba(244,197,66,0.3);
    transform:translateY(-1px);
  }
  .star-btn.selected .n{color:#2c3e50;}
  .star-btn:active{transform:scale(0.96);}

  .level-desc{
    font-size:12.5px; line-height:1.5; color:var(--text); background:var(--bg);
    border-left:3px solid var(--accent); border-radius:6px; padding:8px 10px; min-height:20px;
  }
  .level-desc .lvl-tag{font-weight:700; color:var(--accent); margin-right:4px;}
  .level-desc.empty{color:var(--subtitle); font-style:italic;}

  .crit-checklist{
    list-style:none; margin:8px 0 0; padding:0;
    display:flex; flex-direction:column; gap:6px;
  }
  .crit-checklist li{
    font-size:12px; line-height:1.5; color:var(--text);
    background:var(--bg); border-radius:8px; padding:6px 10px;
    display:flex; gap:6px; align-items:baseline;
  }
  .crit-checklist li::before{content:"✓"; color:var(--accent-green); font-weight:700; flex:0 0 auto;}
  .crit-checklist .lvl-tag{font-weight:700; color:var(--accent); flex:0 0 auto;}

  .footer-actions{
    position:sticky; bottom:0; margin-top:20px;
    background:linear-gradient(180deg, transparent, var(--bg) 30%);
    padding:16px 0 6px;
    display:flex; gap:10px;
  }
  .btn{
    flex:1; padding:13px; border-radius:12px; border:none; font-family:inherit;
    font-weight:700; font-size:14.5px; cursor:pointer; transition:transform .12s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-save{background:var(--accent); color:#fff;}
  .btn-save:hover{opacity:0.9;}
  .btn-print{background:var(--surface); color:var(--text); border:1.5px solid var(--border);}
  .btn-print:hover{background:var(--bg);}

  .status-msg{
    text-align:center; font-size:12.5px; color:var(--accent-green); font-weight:600; min-height:18px; margin-top:6px;
  }

  .hint{
    text-align:center; font-size:11.5px; color:var(--subtitle); margin:14px 0 4px; line-height:1.5;
  }

  @media print{
    .footer-actions, .setup, .hint{display:none;}
    body{background:#fff;}
  }
</style>
<link rel="stylesheet" href="shared/app-shell.css">
</head>
<body data-page="progress">
<div id="appShellRoot"></div>
<div id="pageBody">
<div class="wrap">

  <div class="page-header" style="margin-bottom: 20px;">
    <h2 id="pageTitle" style="margin:0 0 4px;">📊 મારું પ્રોગ્રેસ કાર્ડ</h2>
    <p id="pageSub" style="color:var(--subtitle); font-size:0.9rem; margin:0 0 8px;">તમારો પોતાનો ★ પસંદ કરો — 20 મુદ્દા પર તમારું પ્રામાણિક સેલ્ફ-રેટિંગ</p>
    <div id="studentHeader" style="display: flex; gap: 16px; font-size: 0.95rem; font-weight: 700; color: var(--accent); background: var(--card-bg); padding: 8px 16px; border-radius: 10px; border: 1px solid var(--border); width: fit-content; margin-top: 8px;">
      <span id="headerName">👤 -</span>
      <span id="headerBatch">📅 -</span>
    </div>
  </div>

  <div class="dial-section">
    <div class="dial" id="dial">
      <svg viewBox="0 0 100 100">
        <circle class="dial-track" cx="50" cy="50" r="42"></circle>
        <circle class="dial-progress" id="dialProgress" cx="50" cy="50" r="42"></circle>
      </svg>
      <span id="dialPct">0%</span>
    </div>
    <div class="dial-meta">
      <div class="tot"><span id="totalStarsLabel">કુલ સ્ટાર:</span> <span id="totStars">0</span> / <span id="maxStars">100</span></div>
      <div class="grade" id="gradeLine">હજુ કોઈ ★ પસંદ કર્યો નથી</div>
    </div>
  </div>

  <div class="criteria" id="criteriaContainer"></div>

  <div class="status-msg" id="statusMsg"></div>

  <p class="hint" id="hintText">📌 જે ★ પર તમે ક્લિક કરો છો, એ જ તમારું ફાઇનલ સેલ્ફ-રેટિંગ ગણાય છે — ટીચર નહીં, વિદ્યાર્થી પોતે પસંદ કરે છે.</p>

</div>

const STAR_LABEL = ["0★","1★","2★","3★","4★"];
const STAR_GLYPH_COUNT = [0,1,1,1,2]; // level -> number of ★ glyphs shown on the button
const MAX_PER_CRIT = STAR_GLYPH_COUNT.reduce((a,b)=>a+b,0); // 5
let ratings = {}; // idx -> array of independently-toggled levels, e.g. [1,2,4]
let currentKey = null;

const container = document.getElementById('criteriaContainer');

function buildCards(){
  container.innerHTML = "";
  CRITERIA.forEach((c, idx) => {
    const card = document.createElement('div');
    card.className = 'crit-card';

    const head = document.createElement('div');
    head.className = 'crit-head';
    head.innerHTML = `<span class="crit-num">${idx+1}.</span><span class="crit-title">${c.t}</span>`;
    card.appendChild(head);

    const starsRow = document.createElement('div');
    starsRow.className = 'stars';
    for(let s=0; s<=4; s++){
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'star-btn';
      b.dataset.idx = idx;
      b.dataset.star = s;
      const glyphs = '★'.repeat(STAR_GLYPH_COUNT[s]) || '☆';
      b.innerHTML = `${glyphs}<span class="n">${STAR_LABEL[s]}</span>`;
      b.addEventListener('click', () => selectStar(idx, s));
      starsRow.appendChild(b);
    }
    card.appendChild(starsRow);

    const desc = document.createElement('div');
    desc.className = 'level-desc empty';
    desc.id = `desc-${idx}`;
    desc.textContent = t.defaultInstruction;
    card.appendChild(desc);

    const checklist = document.createElement('ul');
    checklist.className = 'crit-checklist';
    checklist.id = `checklist-${idx}`;
    card.appendChild(checklist);

    container.appendChild(card);
  });
}

async function selectStar(idx, star){
  if (!confirm(t.confirmHonesty)) return;

  if(!ratings[idx]) ratings[idx] = [];
  const pos = ratings[idx].indexOf(star);
  if(pos === -1){
    ratings[idx].push(star);
  } else {
    ratings[idx].splice(pos, 1);
  }

  if (currentKey) {
    try {
      localStorage.setItem(currentKey, JSON.stringify(ratings));
    } catch(e) {}
  }

  if (session && session.phone) {
    try {
      await saveProgress(session.phone, ratings);
    } catch(e) {
      console.error('Database auto-save failed:', e);
    }
  }

  refreshCard(idx);
  refreshDial();
}

function refreshCard(idx){
  const selected = ratings[idx] || [];
  const buttons = container.querySelectorAll(`.star-btn[data-idx="${idx}"]`);
  buttons.forEach(b => {
    b.classList.toggle('selected', selected.includes(Number(b.dataset.star)));
  });

  const desc = document.getElementById(`desc-${idx}`);
  const checklist = document.getElementById(`checklist-${idx}`);
  checklist.innerHTML = "";

  if(selected.length === 0){
    desc.className = 'level-desc empty';
    desc.textContent = t.defaultInstruction;
    return;
  }

  desc.className = 'level-desc';
  const sortedSel = [...selected].sort((a,b)=>a-b);
  const totalHere = sortedSel.reduce((s,v)=>s+STAR_GLYPH_COUNT[v],0);
  desc.innerHTML = `<span class="lvl-tag">${totalHere}${t.starEarned}</span>${t.selectedLevels}${sortedSel.map(v=>STAR_LABEL[v]).join(', ')}`;

  sortedSel.forEach(v => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="lvl-tag">${STAR_LABEL[v]}</span> ${CRITERIA[idx].levels[v]}`;
    checklist.appendChild(li);
  });
}

const DIAL_R = 42;
const DIAL_CIRC = 2 * Math.PI * DIAL_R;
const dialProgressEl = document.getElementById('dialProgress');
dialProgressEl.style.strokeDasharray = `${DIAL_CIRC}`;
dialProgressEl.style.strokeDashoffset = `${DIAL_CIRC}`;

function refreshDial(){
  const total = Object.values(ratings).reduce((sum, levels) => {
    return sum + levels.reduce((s,v) => s + STAR_GLYPH_COUNT[v], 0);
  }, 0);
  const maxTotal = CRITERIA.length * MAX_PER_CRIT;
  const pct = Math.round((total / maxTotal) * 100);
  const offset = DIAL_CIRC - (pct / 100) * DIAL_CIRC;
  dialProgressEl.style.strokeDashoffset = `${offset}`;
  document.getElementById('dialPct').textContent = pct + '%';
  document.getElementById('totStars').textContent = total;
  document.getElementById('maxStars').textContent = maxTotal;

  let gradeText = t.noStars;
  const filledCount = Object.values(ratings).filter(levels => levels.some(v => v > 0)).length;
  if(filledCount > 0){
    if (total < 10) gradeText = t.underD;
    else if (total < 20) gradeText = t.gradeD;
    else if (total < 30) gradeText = t.gradeC;
    else if (total < 40) gradeText = t.gradeB;
    else if (total < 60) gradeText = t.gradeA;
    else gradeText = t.gradeSuper;
    gradeText += ` (${filledCount}/${CRITERIA.length} ${t.pointsTouched})`;
  }
  document.getElementById('gradeLine').textContent = gradeText;
}

    if (!dbProfile) {
      const profileKey = 'harmonyProfile:' + session.phone;
      try { profile = JSON.parse(localStorage.getItem(profileKey) || '{}'); } catch(e) {}
    } else {
      profile = dbProfile;
      try { localStorage.setItem('harmonyProfile:' + session.phone, JSON.stringify(profile)); } catch(e) {}
    }
    
    document.getElementById('headerName').textContent = '👤 ' + (profile.name || '-');
    document.getElementById('headerBatch').textContent = '📅 ' + (profile.batch || '-');

    // 2. Fetch ratings
    let dbRatings = null;
    if (user) {
      dbRatings = await getProgress(session.phone);
    }
    
    if (!dbRatings || Object.keys(dbRatings).length === 0) {
      currentKey = 'progress:' + session.phone;
      try {
        const raw = localStorage.getItem(currentKey);
        ratings = raw ? JSON.parse(raw) : {};
      } catch(e) {
        ratings = {};
      }
    } else {
      ratings = dbRatings;
      try { localStorage.setItem('progress:' + session.phone, JSON.stringify(ratings)); } catch(e) {}
    }
  }
  
  applyPageTranslations();
  buildCards();
  CRITERIA.forEach((c, idx) => refreshCard(idx));
  refreshDial();
}

initProgress();
</script>
</div>
</body>
</html>
