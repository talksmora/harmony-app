<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Riyaaz Pad - Harmony Music</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="shared/theme.css">
<link rel="stylesheet" href="shared/app-shell.css">
<style>
  body {
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    background: #05070a;
    overflow: hidden;
    margin: 0;
    padding: 0;
  }
  /* Force main-area, page-content, and pageBody to stretch and not collapse */
  .main-area {
    height: 100vh !important;
    overflow: hidden !important;
  }
  body[data-page="riyaaz-pad"] .page-content {
    padding: 0 !important;
    overflow: hidden !important;
    height: calc(100vh - 62px) !important;
    display: flex !important;
    flex-direction: column !important;
    box-sizing: border-box !important;
  }
  #pageBody {
    height: 100% !important;
    width: 100% !important;
    display: flex !important;
    flex-direction: column !important;
    box-sizing: border-box !important;
    overflow: hidden !important;
  }
  .pad-container {
    display: flex !important;
    flex-direction: column !important;
    height: 100% !important;
    width: 100% !important;
    gap: 6px !important;
    padding: 6px !important;
    box-sizing: border-box !important;
  }
  /* Premium dark console panel */
  .controls-panel {
    background: rgba(14, 18, 24, 0.95);
    border: 1px solid var(--border);
    backdrop-filter: blur(15px);
    border-radius: 12px;
    padding: 8px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
  }
  .control-group {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
  }
  .control-group label {
    font-weight: 700;
    color: #c9a876;
    text-transform: uppercase;
    font-size: 0.7rem;
    letter-spacing: 0.5px;
  }
  .control-group select, .control-group input[type="range"] {
    background: #191f29;
    color: #f3e6d0;
    border: 1.5px solid var(--border);
    padding: 4px 8px;
    border-radius: 6px;
    outline: none;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .control-group input[type="range"] {
    width: 70px;
    height: 5px;
    -webkit-appearance: none;
    appearance: none;
    background: var(--border);
    border-radius: 2px;
  }
  .control-group input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #b8860b;
    box-shadow: 0 0 6px #b8860b;
    cursor: pointer;
  }
  .instrument-presets {
    display: flex;
    gap: 4px;
  }
  .preset-btn {
    background: #191f29;
    color: #c9a876;
    border: 1.5px solid var(--border);
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 0.72rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .preset-btn.active {
    background: linear-gradient(135deg, #b8860b, #8a5a0a);
    color: #080a0e;
    border-color: #f4c542;
    box-shadow: 0 0 10px rgba(184, 134, 11, 0.4);
  }
  /* Non-interactive play canvas wrap stretching to full height */
  .canvas-wrap {
    flex: 1 !important;
    position: relative !important;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    background: #030406;
    box-shadow: 0 8px 30px rgba(0,0,0,0.6) inset;
    width: 100% !important;
  }
  #surface {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
</style>
</head>
<body data-page="riyaaz-pad">
  <div id="appShellRoot"></div>
  <div id="pageBody" style="display:none;">
    <div class="pad-container">
      <div class="controls-panel">
        <div class="control-group">
          <label for="scaleSelect">🎵 રાગ / Raga:</label>
          <select id="scaleSelect">
            <option value="bilawal">Bilawal (Major)</option>
            <option value="yaman">Yaman (Kalyan)</option>
            <option value="bhairav">Bhairav</option>
            <option value="bhairavi" selected>Bhairavi</option>
            <option value="kafi">Kafi</option>
            <option value="asavari">Asavari</option>
          </select>
        </div>
        
        <div class="control-group">
          <label>🎻 સાઉન્ડ:</label>
          <div class="instrument-presets">
            <button class="preset-btn active" data-preset="sitar">Sitar</button>
            <button class="preset-btn" data-preset="flute">Bansuri</button>
            <button class="preset-btn" data-preset="violin">Violin</button>
            <button class="preset-btn" data-preset="guitar">Guitar</button>
            <button class="preset-btn" data-preset="sarangi">Sarangi</button>
          </div>
        </div>

        <div class="control-group">
          <label for="glideRange">⚡ Slide:</label>
          <input type="range" id="glideRange" min="0.01" max="0.3" step="0.01" value="0.06">
        </div>
        
        <div class="control-group">
          <label for="vibratoRange">📳 Vib Depth:</label>
          <input type="range" id="vibratoRange" min="0" max="15" step="1" value="8">
        </div>

        <div class="control-group">
          <label for="echoBtn" id="lblEcho">🔊 Reverb Echo</label>
          <input type="checkbox" id="echoBtn" checked style="width: 15px; height: 15px; accent-color: #b8860b;">
        </div>
      </div>

      <div class="canvas-wrap">
        <canvas id="surface"></canvas>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="shared/utils.js"></script>
<script src="shared/supabase-client.js"></script>
<script src="shared/app-shell.js"></script>
<script>
(function(){
  const lang = (() => { try { return localStorage.getItem('harmonyAppLang') || 'gu'; } catch(e) { return 'gu'; } })();
  const pageTitle = lang === 'en' ? '🎹 Riyaaz Pad' : lang === 'hi' ? '🎹  रियाज़ पैડ' : '🎹 રિયાઝ પેડ';

  const SCALE_DATA = {
    bilawal: {
      swars: ['Sa', 'Re', 'Ga', 'Ma', 'Pa', 'Dha', 'Ni', 'Sa^'],
      intervals: [0, 2, 4, 5, 7, 9, 11, 12]
    },
    yaman: {
      swars: ['Sa', 'Re', 'Ga', 'Ma#', 'Pa', 'Dha', 'Ni', 'Sa^'],
      intervals: [0, 2, 4, 6, 7, 9, 11, 12]
    },
    bhairav: {
      swars: ['Sa', 'Re_b', 'Ga', 'Ma', 'Pa', 'Dha_b', 'Ni', 'Sa^'],
      intervals: [0, 1, 4, 5, 7, 8, 11, 12]
    },
    bhairavi: {
      swars: ['Sa', 'Re_b', 'Ga_b', 'Ma', 'Pa', 'Dha_b', 'Ni_b', 'Sa^'],
      intervals: [0, 1, 3, 5, 7, 8, 10, 12]
    },
    kafi: {
      swars: ['Sa', 'Re', 'Ga_b', 'Ma', 'Pa', 'Dha', 'Ni_b', 'Sa^'],
      intervals: [0, 2, 3, 5, 7, 9, 10, 12]
    },
    asavari: {
      swars: ['Sa', 'Re', 'Ga_b', 'Ma', 'Pa', 'Dha_b', 'Ni_b', 'Sa^'],
      intervals: [0, 2, 3, 5, 7, 8, 10, 12]
    }
  };

  const INSTRUMENT_PRESETS = {
    sitar: {
      wave1: 'sawtooth', wave2: 'square', detune2: 2.01, mix2: 0.15,
      filterType: 'bandpass', filterMult: 3.2, filterMaxFreq: 6000, filterQ: 4.5,
      attack: 0.005, peakGain: 0.28, sustainGain: 0.12, pluck: true, release: 1.2
    },
    flute: {
      wave1: 'sine', wave2: 'triangle', detune2: 2.0, mix2: 0.08,
      filterType: 'lowpass', filterMult: 5.0, filterMaxFreq: 4000, filterQ: 1.0,
      attack: 0.1, peakGain: 0.28, sustainGain: 0.28, pluck: false, release: 0.25
    },
    violin: {
      wave1: 'sawtooth', wave2: 'sawtooth', detune2: 1.006, mix2: 0.55,
      filterType: 'lowpass', filterMult: 6.0, filterMaxFreq: 7000, filterQ: 1.5,
      attack: 0.14, peakGain: 0.22, sustainGain: 0.22, pluck: false, release: 0.35
    },
    guitar: {
      wave1: 'sawtooth', wave2: 'triangle', detune2: 2.0, mix2: 0.25,
      filterType: 'lowpass', filterMult: 4.5, filterMaxFreq: 5000, filterQ: 2.0,
      attack: 0.004, peakGain: 0.3, sustainGain: 0.1, pluck: true, release: 0.9
    },
    sarangi: {
      wave1: 'sawtooth', wave2: 'sawtooth', detune2: 1.01, mix2: 0.45,
      filterType: 'bandpass', filterMult: 2.5, filterMaxFreq: 5500, filterQ: 3.0,
      attack: 0.12, peakGain: 0.24, sustainGain: 0.24, pluck: false, release: 0.4
    }
  };

  let activePreset = 'sitar';
  const scaleSelect = document.getElementById('scaleSelect');
  const glideRange = document.getElementById('glideRange');
  const vibratoRange = document.getElementById('vibratoRange');
  const echoBtn = document.getElementById('echoBtn');

  // Canvas Setup
  const canvas = document.getElementById('surface');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;

  function resize() {
    const parent = canvas.parentElement;
    W = parent.clientWidth;
    H = parent.clientHeight;
    canvas.width = W * window.devicePixelRatio;
    canvas.height = H * window.devicePixelRatio;
    ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const NUM_STRINGS = 4;
  const BASE_SA = 130.81; // C3
  const ROW_SEMITONE_OFFSETS = [15, 10, 5, 0]; // fourths tuning offsets

  // Web Audio Context
  let audioCtx = null;
  let reverbNode = null;
  let resonanceFilters = []; // Sympathetic Resonators
  let workletModuleLoaded = false;
  const activeVoices = new Map();

  // Load AudioWorklet from Blob URL
  async function ensureCtx() {
    if (audioCtx) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return;
    }
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    if (!workletModuleLoaded) {
      const code = `
        class WaveguideStringProcessor extends AudioWorkletProcessor {
          static get parameterDescriptors() {
            return [
              { name: 'frequency', defaultValue: 440, min: 20, max: 20000 },
              { name: 'damping', defaultValue: 0.18, min: 0.0, max: 0.99 },
              { name: 'feedback', defaultValue: 0.988, min: 0.8, max: 0.9999 }
            ];
          }
          constructor() {
            super();
            this.bufferSize = 44100 * 2;
            this.buffer = new Float32Array(this.bufferSize);
            this.writeIdx = 0;
            this.excited = false;
            this.excitationLength = 0;
            this.excitationBuffer = null;
            this.lastOutput = 0;
            this.port.onmessage = (e) => {
              if (e.data.type === 'pluck') {
                this.triggerPluck(e.data.strength, e.data.frequency);
              }
            };
          }
          triggerPluck(strength, freq) {
            const periodSamples = Math.floor(sampleRate / freq);
            this.excitationLength = Math.max(10, Math.min(periodSamples, 800));
            this.excitationBuffer = new Float32Array(this.excitationLength);
            for (let i = 0; i < this.excitationLength; i++) {
              this.excitationBuffer[i] = (Math.random() * 2 - 1) * strength * Math.pow(1 - i / this.excitationLength, 1.8);
            }
            this.writeIdx = 0;
            this.buffer.fill(0);
            this.excited = true;
            this.excitationIdx = 0;
          }
          process(inputs, outputs, parameters) {
            const output = outputs[0];
            const channel = output[0];
            if (!channel) return true;
            const freqParam = parameters.frequency;
            const dampingParam = parameters.damping;
            const feedbackParam = parameters.feedback;
            const sr = sampleRate;
            const len = channel.length;
            for (let i = 0; i < len; i++) {
              const f = freqParam.length > 1 ? freqParam[i] : freqParam[0];
              const damping = dampingParam.length > 1 ? dampingParam[i] : dampingParam[0];
              const feedback = feedbackParam.length > 1 ? feedbackParam[i] : feedbackParam[0];
              const delaySamples = sr / f;
              let readIdx = this.writeIdx - delaySamples;
              if (readIdx < 0) readIdx += this.bufferSize;
              const baseIdx = Math.floor(readIdx);
              const frac = readIdx - baseIdx;
              const nextIdx = (baseIdx + 1) % this.bufferSize;
              const sampleA = this.buffer[baseIdx];
              const sampleB = this.buffer[nextIdx];
              const interpolatedSample = sampleA + frac * (sampleB - sampleA);
              const filteredSample = (1 - damping) * interpolatedSample + damping * this.lastOutput;
              this.lastOutput = filteredSample;
              let inputEnergy = 0;
              if (this.excited && this.excitationBuffer && this.excitationIdx < this.excitationLength) {
                inputEnergy = this.excitationBuffer[this.excitationIdx];
                this.excitationIdx++;
                if (this.excitationIdx >= this.excitationLength) {
                  this.excited = false;
                }
              }
              const nextWriteVal = inputEnergy + filteredSample * feedback;
              this.buffer[this.writeIdx] = nextWriteVal;
              channel[i] = filteredSample;
              this.writeIdx = (this.writeIdx + 1) % this.bufferSize;
            }
            for (let c = 1; c < output.length; c++) {
              output[c].set(channel);
            }
            return true;
          }
        }
        registerProcessor('waveguide-string-processor', WaveguideStringProcessor);
      `;
      const blob = new Blob([code], { type: 'application/javascript' });
      const url = URL.createObjectURL(blob);
      await audioCtx.audioWorklet.addModule(url);
      workletModuleLoaded = true;
    }

    buildReverb();
    buildSympatheticResonators();
  }

  // High-fidelity synthetic convolver reverb
  function buildReverb() {
    reverbNode = audioCtx.createConvolver();
    const len = audioCtx.sampleRate * 2.2;
    const impulse = audioCtx.createBuffer(2, len, audioCtx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const data = impulse.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
      }
    }
    reverbNode.buffer = impulse;
    reverbNode.connect(audioCtx.destination);
  }

  // Sympathetic resonators representing wood/body resonance
  function buildSympatheticResonators() {
    resonanceFilters.forEach(res => {
      try { res.filter.disconnect(); } catch(e) {}
    });
    resonanceFilters = [];
    const scaleKey = scaleSelect.value;
    const scale = SCALE_DATA[scaleKey] || SCALE_DATA.bilawal;

    const baseOctaves = [1, 2]; 
    const targetSemitones = [0, 5, 7]; 

    targetSemitones.forEach(semi => {
      baseOctaves.forEach(oct => {
        const freq = BASE_SA * Math.pow(2, oct) * Math.pow(2, semi / 12);
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = freq;
        filter.Q.value = 40; 

        const gain = audioCtx.createGain();
        gain.gain.value = 0.08; 

        filter.connect(gain).connect(audioCtx.destination);
        resonanceFilters.push({ filter, gain });
      });
    });
  }

  function outputChain(node) {
    node.connect(audioCtx.destination);
    if (echoBtn.checked && reverbNode) {
      const send = audioCtx.createGain();
      send.gain.value = 0.35;
      node.connect(send).connect(reverbNode);
    }
    resonanceFilters.forEach(res => {
      node.connect(res.filter);
    });
  }

  // Waveguide physical string SynthVoice
  class SynthVoice {
    constructor(freq) {
      const now = audioCtx.currentTime;
      const cfg = INSTRUMENT_PRESETS[activePreset];

      this.master = audioCtx.createGain();
      this.master.gain.setValueAtTime(0, now);
      outputChain(this.master);

      this.filter = audioCtx.createBiquadFilter();
      this.filter.type = cfg.filterType;
      this.filter.frequency.value = Math.min(cfg.filterMaxFreq, freq * cfg.filterMult);
      if (cfg.filterQ) this.filter.Q.value = cfg.filterQ;
      this.filter.connect(this.master);

      this.stringNode = new AudioWorkletNode(audioCtx, 'waveguide-string-processor');
      this.stringNode.connect(this.filter);

      let dampingVal = 0.18;
      let feedbackVal = 0.99; 

      if (activePreset === 'flute') {
        dampingVal = 0.45; 
        feedbackVal = 0.97; 
      } else if (activePreset === 'violin' || activePreset === 'sarangi') {
        dampingVal = 0.28;
        feedbackVal = 0.992;
      }

      this.stringNode.parameters.get('damping').setValueAtTime(dampingVal, now);
      this.stringNode.parameters.get('feedback').setValueAtTime(feedbackVal, now);
      this.stringNode.parameters.get('frequency').setValueAtTime(freq, now);

      this.stringNode.port.postMessage({
        type: 'pluck',
        strength: 0.35,
        frequency: freq
      });

      this.vibratoLfo = audioCtx.createOscillator();
      this.vibratoLfo.frequency.value = 5.8;
      this.vibratoGain = audioCtx.createGain();
      this.vibratoGain.gain.value = 0;

      this.vibratoLfo.connect(this.vibratoGain).connect(this.stringNode.parameters.get('frequency'));
      this.vibratoLfo.start(now);

      this.master.gain.setTargetAtTime(cfg.peakGain, now, cfg.attack);
    }

    glideTo(freq, glideTime) {
      const now = audioCtx.currentTime;
      this.stringNode.parameters.get('frequency').setTargetAtTime(freq, now, glideTime);
    }

    release() {
      const now = audioCtx.currentTime;
      const cfg = INSTRUMENT_PRESETS[activePreset];
      
      this.stringNode.parameters.get('feedback').setTargetAtTime(0.85, now, cfg.release / 3);
      this.master.gain.cancelScheduledValues(now);
      this.master.gain.setValueAtTime(this.master.gain.value, now);
      this.master.gain.setTargetAtTime(0, now, cfg.release / 4);

      const nodeRef = this.stringNode;
      const lfoRef = this.vibratoLfo;

      setTimeout(() => {
        try {
          nodeRef.disconnect();
          lfoRef.stop(); lfoRef.disconnect();
        } catch(e) {}
      }, (cfg.release + 0.5) * 1000);
    }
  }

  function getSwarNameForSemitones(semitones, scale) {
    const octave = Math.floor(semitones / 12);
    const relSemitones = ((semitones % 12) + 12) % 12;

    let closestIdx = 0;
    let minDiff = 999;
    for (let i = 0; i < scale.intervals.length; i++) {
      const diff = Math.abs(scale.intervals[i] - relSemitones);
      if (diff < minDiff) {
        minDiff = diff;
        closestIdx = i;
      }
    }

    const baseSwar = scale.swars[closestIdx];
    if (octave > 0) {
      return baseSwar + '^'.repeat(octave);
    } else if (octave < 0) {
      return baseSwar + '_'.repeat(-octave);
    }
    return baseSwar;
  }

  function xyToFreq(x, y, isSnap) {
    const rh = H / NUM_STRINGS;
    let stringIndex = Math.floor((H - y) / rh);
    stringIndex = Math.max(0, Math.min(NUM_STRINGS - 1, stringIndex));

    const scaleKey = scaleSelect.value;
    const scale = SCALE_DATA[scaleKey] || SCALE_DATA.bilawal;

    const stringSemitones = ROW_SEMITONE_OFFSETS[stringIndex];
    const stringBaseFreq = BASE_SA * Math.pow(2, stringSemitones / 12);

    const noteWidth = W / scale.swars.length;
    const rawCol = x / noteWidth;

    if (isSnap) {
      const nearestCol = Math.max(0, Math.min(scale.swars.length - 1, Math.round(rawCol)));
      const interval = scale.intervals[nearestCol];
      return stringBaseFreq * Math.pow(2, interval / 12);
    }

    const colIdx = Math.floor(rawCol);
    const fraction = rawCol - colIdx;

    if (colIdx < 0) return stringBaseFreq;
    if (colIdx >= scale.swars.length - 1) {
      const lastInterval = scale.intervals[scale.swars.length - 1];
      return stringBaseFreq * Math.pow(2, lastInterval / 12);
    }

    const intervalA = scale.intervals[colIdx];
    const intervalB = scale.intervals[colIdx + 1];

    const freqA = stringBaseFreq * Math.pow(2, intervalA / 12);
    const freqB = stringBaseFreq * Math.pow(2, intervalB / 12);

    return freqA * Math.pow(freqB / freqA, fraction);
  }

  function drawInterface() {
    ctx.clearRect(0, 0, W, H);
    const rh = H / NUM_STRINGS;
    const scaleKey = scaleSelect.value;
    const scale = SCALE_DATA[scaleKey] || SCALE_DATA.bilawal;
    const noteWidth = W / scale.swars.length;

    for (let s = 0; s < NUM_STRINGS; s++) {
      const y = H - (s + 1) * rh;
      ctx.fillStyle = s % 2 === 0 ? '#0d1117' : '#090b0e';
      ctx.fillRect(0, y, W, rh);

      const stringSemitones = ROW_SEMITONE_OFFSETS[s];

      for (let n = 0; n < scale.swars.length; n++) {
        const x = n * noteWidth;
        ctx.strokeStyle = 'rgba(255,255,255,0.03)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, y); ctx.lineTo(x, y + rh);
        ctx.stroke();

        const totalSemitones = stringSemitones + scale.intervals[n];
        const swar = getSwarNameForSemitones(totalSemitones, scale);

        ctx.fillStyle = swar.startsWith('Sa') ? 'rgba(184, 134, 11, 0.45)' : 'rgba(201, 168, 118, 0.18)';
        ctx.font = '800 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(swar, x + noteWidth / 2, y + rh / 2 + 5);
      }

      ctx.strokeStyle = 'rgba(184, 134, 11, 0.35)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, y + rh / 2);
      ctx.lineTo(W, y + rh / 2);
      ctx.stroke();
    }

    activeVoices.forEach((t) => {
      const grad = ctx.createRadialGradient(t.x, t.y, 2, t.x, t.y, 35);
      grad.addColorStop(0, 'rgba(184, 134, 11, 0.85)');
      grad.addColorStop(0.3, 'rgba(231, 76, 60, 0.35)');
      grad.addColorStop(1, 'rgba(231, 76, 60, 0)');
      
      ctx.beginPath();
      ctx.arc(t.x, t.y, 35, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      const rhLocal = H / NUM_STRINGS;
      const stringIdx = Math.floor((H - t.y) / rhLocal);
      const stringY = H - (stringIdx + 1) * rhLocal + rhLocal / 2;

      ctx.strokeStyle = '#e74c3c';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(t.x - 40, stringY + Math.sin(Date.now() * 0.08) * 1.5);
      ctx.lineTo(t.x + 40, stringY - Math.sin(Date.now() * 0.08) * 1.5);
      ctx.stroke();
    });
  }

  async function handleStart(id, x, y) {
    await ensureCtx();
    const freq = xyToFreq(x, y, true);
    const voice = new SynthVoice(freq);
    activeVoices.set(id, {
      startX: x, startY: y,
      x, y, voice, lastY: y, lastX: x,
      wiggleY: 0, wiggleX: 0,
      isFretless: false,
      lastMoveTime: Date.now()
    });
  }

  function handleMove(id, x, y) {
    const t = activeVoices.get(id);
    if (!t) return;

    const dx = Math.abs(x - t.startX);
    const now = Date.now();

    if (!t.isFretless && dx > 12) {
      t.isFretless = true;
    }

    let targetFreq;
    let glideTime = parseFloat(glideRange.value);

    if (t.isFretless) {
      targetFreq = xyToFreq(x, y, false);
      const deltaX = Math.abs(x - t.lastX);
      t.wiggleX = t.wiggleX * 0.8 + deltaX * 0.2;
      
      if (t.wiggleX > 4) {
        glideTime = 0.005; 
      }
    } else {
      targetFreq = xyToFreq(t.startX, t.startY, true);
    }

    t.voice.glideTo(targetFreq, glideTime);

    const relativeY = y % (H / NUM_STRINGS);
    const normY = relativeY / (H / NUM_STRINGS); 
    const cutoff = 1000 + (1 - normY) * 3500;
    t.voice.filter.frequency.setTargetAtTime(cutoff, audioCtx.currentTime, 0.05);

    const dy = Math.abs(y - t.lastY);
    t.wiggleY = t.wiggleY * 0.82 + dy * 0.18;
    const userMaxVib = parseFloat(vibratoRange.value);
    const depth = Math.min(userMaxVib, t.wiggleY * 2.2);
    t.voice.vibratoGain.gain.setTargetAtTime(depth, audioCtx.currentTime, 0.04);

    t.lastY = y;
    t.lastX = x;
    t.x = x;
    t.y = y;
    t.lastMoveTime = now;
  }

  function handleEnd(id) {
    const t = activeVoices.get(id);
    if (!t) return;
    t.voice.release();
    activeVoices.delete(id);
  }

  // Pointer event listeners
  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    const rect = canvas.getBoundingClientRect();
    handleStart(e.pointerId, e.clientX - rect.left, e.clientY - rect.top);
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!activeVoices.has(e.pointerId)) return;
    const rect = canvas.getBoundingClientRect();
    handleMove(e.pointerId, e.clientX - rect.left, e.clientY - rect.top);
  });

  canvas.addEventListener('pointerup', (e) => handleEnd(e.pointerId));
  canvas.addEventListener('pointercancel', (e) => handleEnd(e.pointerId));
  canvas.addEventListener('pointerleave', (e) => handleEnd(e.pointerId));

  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activePreset = btn.getAttribute('data-preset');
    };
  });

  scaleSelect.onchange = () => {
    if (audioCtx) buildSympatheticResonators();
  };

  // Auto-resizing render loop with visual try-catch debugger
  function loop() {
    try {
      const parent = canvas.parentElement;
      if (parent) {
        const currentWidth = parent.clientWidth;
        const currentHeight = parent.clientHeight;
        if (currentWidth !== W || currentHeight !== H) {
          resize();
        }
      }

      const now = Date.now();
      activeVoices.forEach((t) => {
        if (t.isFretless && (now - t.lastMoveTime > 180)) {
          const snapFreq = xyToFreq(t.x, t.y, true);
          t.voice.glideTo(snapFreq, 0.25); 
        }
      });

      drawInterface();
    } catch (e) {
      ctx.fillStyle = '#06080b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ff3333';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText("SYNTH ERROR: " + e.message, 30, 50);
      ctx.font = '13px monospace';
      ctx.fillText("Stack: " + e.stack.substring(0, 120), 30, 80);
      console.error("Riyaaz Pad Crash:", e);
    }
    requestAnimationFrame(loop);
  }
  loop();

  initAppShell({ title: pageTitle });
})();
</script>
