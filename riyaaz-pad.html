<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Riyaaz Pad - Harmony Music</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="shared/theme.css">
<link rel="stylesheet" href="shared/app-shell.css">
<style>
  body {
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    background: #06080a;
    overflow: hidden;
  }
  .pad-container {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 75px);
    gap: 8px;
    padding: 8px;
    box-sizing: border-box;
  }
  /* Futuristic Console Panel */
  .controls-panel {
    background: rgba(13, 17, 23, 0.9);
    border: 1px solid var(--border);
    backdrop-filter: blur(12px);
    border-radius: 16px;
    padding: 10px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .control-group {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
  }
  .control-group label {
    font-weight: 700;
    color: var(--text);
    text-transform: uppercase;
    font-size: 0.75rem;
    letter-spacing: 0.5px;
  }
  .control-group select, .control-group input[type="range"] {
    background: var(--surface);
    color: var(--text);
    border: 1.5px solid var(--border);
    padding: 6px 12px;
    border-radius: 8px;
    outline: none;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .control-group input[type="range"] {
    width: 80px;
    height: 6px;
    -webkit-appearance: none;
    appearance: none;
    background: var(--border);
    border-radius: 3px;
  }
  .control-group input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #e74c3c;
    box-shadow: 0 0 8px #e74c3c;
    cursor: pointer;
  }
  .instrument-presets {
    display: flex;
    gap: 6px;
  }
  .preset-btn {
    background: var(--surface);
    color: var(--subtitle);
    border: 1.5px solid var(--border);
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .preset-btn.active {
    background: linear-gradient(135deg, #e74c3c, #f39c12);
    color: #fff;
    border-color: #e74c3c;
    box-shadow: 0 0 15px rgba(231, 76, 60, 0.4);
    transform: scale(1.05);
  }
  /* Glowing Play Surface */
  .play-surface {
    flex: 1;
    background: #040507;
    border: 1.5px solid var(--border);
    border-radius: 20px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 4px;
    box-sizing: border-box;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6) inset;
  }
  .pad-row {
    flex: 1;
    display: flex;
    gap: 4px;
  }
  .pad-key {
    flex: 1;
    background: rgba(255, 255, 255, 0.01);
    border: 1px solid rgba(255, 255, 255, 0.03);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    box-sizing: border-box;
    overflow: hidden;
  }
  /* String overlay lines to simulate fretboard/fret lines */
  .pad-key::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    height: 2px;
    background: rgba(255, 255, 255, 0.12);
    pointer-events: none;
    box-shadow: 0 0 3px rgba(255, 255, 255, 0.1);
  }
  /* Key Active Glowing Strings */
  .pad-key.active-touch::after {
    background: #e74c3c;
    box-shadow: 0 0 12px #e74c3c, 0 0 20px #e67e22;
    animation: stringVibrate 0.05s infinite alternate;
  }
  .pad-key .note-name {
    font-size: 1.25rem;
    font-weight: 900;
    color: var(--text);
    text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    z-index: 2;
  }
  .pad-key .note-swar {
    font-size: 0.72rem;
    color: var(--subtitle);
    margin-top: 3px;
    z-index: 2;
  }
  .pad-key.sa-root {
    background: rgba(231, 76, 60, 0.05);
    border-color: rgba(231, 76, 60, 0.15);
  }
  .pad-key.sa-root .note-name {
    color: #e74c3c;
    text-shadow: 0 0 10px rgba(231, 76, 60, 0.6);
  }
  .pad-key.active-touch {
    background: radial-gradient(circle, rgba(231,76,60,0.25) 0%, rgba(230,126,34,0.02) 80%) !important;
    border-color: rgba(231, 76, 60, 0.4) !important;
  }
  /* Fretless Pitch indicator pointer */
  .touch-pointer {
    position: absolute;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(231,76,60,0.85) 0%, rgba(230,126,34,0) 70%);
    box-shadow: 0 0 30px #e74c3c, 0 0 15px #f39c12;
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 99;
    display: none;
  }
  @keyframes stringVibrate {
    0% { transform: translateY(-1px); }
    100% { transform: translateY(1px); }
  }
  @media (max-width: 768px) {
    .controls-panel {
      padding: 8px 12px;
      gap: 10px;
    }
    .control-group {
      font-size: 0.8rem;
    }
    .preset-btn {
      padding: 5px 10px;
      font-size: 0.75rem;
    }
    .pad-key .note-name {
      font-size: 1rem;
    }
    .pad-key .note-swar {
      font-size: 0.65rem;
    }
  }
</style>
</head>
<body data-page="riyaaz-pad">
  <div id="appShellRoot"></div>
  <div id="pageBody" style="display:none;">
    <div class="pad-container">
      <div class="controls-panel">
        <div class="control-group">
          <label for="scaleSelect">🎵 રાગ / Raga:</label>
          <select id="scaleSelect">
            <option value="bilawal">Bilawal (Major)</option>
            <option value="yaman">Yaman (Kalyan)</option>
            <option value="bhairav">Bhairav</option>
            <option value="bhairavi" selected>Bhairavi</option>
            <option value="kafi">Kafi</option>
            <option value="asavari">Asavari</option>
          </select>
        </div>
        
        <div class="control-group">
          <label>🎻 Presets:</label>
          <div class="instrument-presets">
            <button class="preset-btn active" data-preset="sitar">Sitar</button>
            <button class="preset-btn" data-preset="flute">Bansuri</button>
            <button class="preset-btn" data-preset="violin">Violin</button>
            <button class="preset-btn" data-preset="shred">Shred Guitar</button>
          </div>
        </div>

        <div class="control-group">
          <label for="glideRange">⚡ Slide Speed:</label>
          <input type="range" id="glideRange" min="0.01" max="0.35" step="0.01" value="0.06">
        </div>
        
        <div class="control-group">
          <label for="vibratoRange">📳 Vibrato:</label>
          <input type="range" id="vibratoRange" min="0" max="15" step="1" value="5">
        </div>

        <div class="control-group">
          <label for="echoBtn" id="lblEcho">🔊 Space Echo</label>
          <input type="checkbox" id="echoBtn" checked style="width: 16px; height: 16px; accent-color: #e74c3c;">
        </div>
      </div>

      <div class="play-surface" id="playSurface"></div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="shared/utils.js"></script>
<script src="shared/supabase-client.js"></script>
<script src="shared/app-shell.js"></script>
<script>
(function(){
  const lang = (() => { try { return localStorage.getItem('harmonyAppLang') || 'gu'; } catch(e) { return 'gu'; } })();
  const pageTitle = lang === 'en' ? '🎹 Riyaaz Pad' : lang === 'hi' ? '🎹 रियाज़ पैड' : '🎹 રિયાઝ પેડ';

  const SCALE_DATA = {
    bilawal: {
      swars: ['Sa', 'Re', 'Ga', 'Ma', 'Pa', 'Dha', 'Ni', 'Sa^'],
      intervals: [0, 2, 4, 5, 7, 9, 11, 12]
    },
    yaman: {
      swars: ['Sa', 'Re', 'Ga', 'Ma#', 'Pa', 'Dha', 'Ni', 'Sa^'],
      intervals: [0, 2, 4, 6, 7, 9, 11, 12]
    },
    bhairav: {
      swars: ['Sa', 'Re_b', 'Ga', 'Ma', 'Pa', 'Dha_b', 'Ni', 'Sa^'],
      intervals: [0, 1, 4, 5, 7, 8, 11, 12]
    },
    bhairavi: {
      swars: ['Sa', 'Re_b', 'Ga_b', 'Ma', 'Pa', 'Dha_b', 'Ni_b', 'Sa^'],
      intervals: [0, 1, 3, 5, 7, 8, 10, 12]
    },
    kafi: {
      swars: ['Sa', 'Re', 'Ga_b', 'Ma', 'Pa', 'Dha', 'Ni_b', 'Sa^'],
      intervals: [0, 2, 3, 5, 7, 9, 10, 12]
    },
    asavari: {
      swars: ['Sa', 'Re', 'Ga_b', 'Ma', 'Pa', 'Dha_b', 'Ni_b', 'Sa^'],
      intervals: [0, 2, 3, 5, 7, 8, 10, 12]
    }
  };

  // Advanced synthesis configuration preset parameters
  const INSTRUMENT_PRESETS = {
    sitar: {
      type: 'waveguide', // plucked waveguide model
      fmRatio: 3.2,
      fmIndex: 2.5,
      attack: 0.005,
      release: 1.2,
      filterFreq: 2800,
      vibratoRate: 8.5,
      vibratoDepth: 3.5
    },
    flute: {
      type: 'sustained-sine',
      fmRatio: 0,
      fmIndex: 0,
      attack: 0.1,
      release: 0.2,
      filterFreq: 1200,
      vibratoRate: 6.2,
      vibratoDepth: 8.0
    },
    violin: {
      type: 'sustained-saw',
      fmRatio: 0,
      fmIndex: 0,
      attack: 0.15,
      release: 0.3,
      filterFreq: 2000,
      vibratoRate: 5.5,
      vibratoDepth: 7.0
    },
    shred: {
      type: 'waveguide-heavy', // waveguide pluck + feedback overdrive
      fmRatio: 2.0,
      fmIndex: 4.0,
      attack: 0.002,
      release: 0.9,
      filterFreq: 3500,
      vibratoRate: 7.0,
      vibratoDepth: 5.0
    }
  };

  let activePreset = 'sitar';
  const scaleSelect = document.getElementById('scaleSelect');
  const glideRange = document.getElementById('glideRange');
  const vibratoRange = document.getElementById('vibratoRange');
  const echoBtn = document.getElementById('echoBtn');
  const playSurface = document.getElementById('playSurface');

  const BASE_SA = 130.81; // C3 Base Frequency to cover lower register nicely

  let audioCtx = null;
  let delayNode = null;
  let delayFeedback = null;
  let distortionNode = null;
  const activeVoices = {}; // Map to track polyphonic voices (key: touch/pointer id)

  // Configure high-quality wave shaping distortion for heavy guitar pluck
  function makeDistortionCurve(amount) {
    const k = typeof amount === 'number' ? amount : 50;
    const n_samples = 44100;
    const curve = new Float32Array(n_samples);
    const deg = Math.PI / 180;
    for (let i = 0; i < n_samples; ++i) {
      const x = (i * 2) / n_samples - 1;
      curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
    }
    return curve;
  }

  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // Echo Setup
    delayNode = audioCtx.createDelay(1.5);
    delayFeedback = audioCtx.createGain();

    delayNode.delayTime.value = 0.38;
    delayFeedback.gain.value = 0.36;

    delayNode.connect(delayFeedback);
    delayFeedback.connect(delayNode);
    delayNode.connect(audioCtx.destination);

    // Distortion Setup for heavy guitar model
    distortionNode = audioCtx.createWaveShaper();
    distortionNode.curve = makeDistortionCurve(60);
    distortionNode.oversample = '4x';
    distortionNode.connect(audioCtx.destination);
  }

  // Synth Voice executing Digital Waveguide String modeling and FM Synthesis
  class SynthVoice {
    constructor(freq, touchX, touchY, visualPointer) {
      this.osc = null;
      this.mod = null;
      this.modGain = null;
      this.lfo = audioCtx.createOscillator();
      this.lfoGain = audioCtx.createGain();
      
      this.gain = audioCtx.createGain();
      this.filter = audioCtx.createBiquadFilter();

      // Digital Waveguide (Karplus-Strong) Loop Nodes
      this.waveguideDelay = null;
      this.waveguideFilter = null;
      this.waveguideFeedback = null;

      this.pointer = visualPointer;
      this.freq = freq;

      this.setup(freq);
      this.updatePointerPosition(touchX, touchY);
    }

    setup(freq) {
      const now = audioCtx.currentTime;
      const preset = INSTRUMENT_PRESETS[activePreset];

      // Configuration of LFO Vibrato
      const userVibMultiplier = parseFloat(vibratoRange.value) / 6;
      this.lfo.frequency.setValueAtTime(preset.vibratoRate, now);
      this.lfoGain.gain.setValueAtTime(preset.vibratoDepth * userVibMultiplier, now);
      this.lfo.connect(this.lfoGain);

      this.gain.gain.setValueAtTime(0, now);
      this.filter.type = 'lowpass';
      this.filter.frequency.setValueAtTime(preset.filterFreq, now);

      if (preset.type.startsWith('waveguide')) {
        // ---- Plucked Digital Waveguide Physical Modeling ----
        const delaySec = 1 / freq;
        this.waveguideDelay = audioCtx.createDelay(1.0);
        this.waveguideDelay.delayTime.setValueAtTime(delaySec, now);

        this.waveguideFilter = audioCtx.createBiquadFilter();
        this.waveguideFilter.type = 'lowpass';
        this.waveguideFilter.frequency.setValueAtTime(preset.filterFreq, now);

        this.waveguideFeedback = audioCtx.createGain();
        // Decay string sustainability
        this.waveguideFeedback.gain.value = preset.type === 'waveguide-heavy' ? 0.992 : 0.985;

        // Feedback loop routing
        this.waveguideDelay.connect(this.waveguideFilter);
        this.waveguideFilter.connect(this.waveguideFeedback);
        this.waveguideFeedback.connect(this.waveguideDelay);

        // Generate pluck impulse: Short 15ms white noise burst
        const bufferSize = audioCtx.sampleRate * 0.015;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noiseSource = audioCtx.createBufferSource();
        noiseSource.buffer = buffer;

        // Connect Exciter to Waveguide
        noiseSource.connect(this.waveguideDelay);

        // Connection to output filter
        this.waveguideDelay.connect(this.filter);
        this.filter.connect(this.gain);

        // Add Sitar Metallic Buzz (FM modulation of waveguide string delay time)
        if (activePreset === 'sitar') {
          this.mod = audioCtx.createOscillator();
          this.modGain = audioCtx.createGain();
          this.mod.type = 'sine';
          this.mod.frequency.setValueAtTime(freq * preset.fmRatio, now);
          this.modGain.gain.setValueAtTime(delaySec * 0.03 * preset.fmIndex, now); // modulate delay time slightly

          this.mod.connect(this.modGain);
          this.modGain.connect(this.waveguideDelay.delayTime);
          this.mod.start(now);
        }

        noiseSource.start(now);
      } else {
        // ---- Continuous Sustained Waves ----
        this.osc = audioCtx.createOscillator();
        this.osc.type = preset.type === 'sustained-saw' ? 'sawtooth' : 'sine';
        this.osc.frequency.setValueAtTime(freq, now);

        this.lfoGain.connect(this.osc.frequency);

        this.osc.connect(this.filter);
        this.filter.connect(this.gain);
        this.osc.start(now);
      }

      // Route Output
      if (preset.type === 'waveguide-heavy') {
        // Guitar overdrive distortion line
        this.gain.connect(distortionNode);
        if (echoBtn.checked) {
          this.gain.connect(delayNode);
        }
      } else {
        this.gain.connect(audioCtx.destination);
        if (echoBtn.checked) {
          this.gain.connect(delayNode);
        }
      }

      this.lfo.start(now);

      // Trigger Gain Attack
      this.gain.gain.linearRampToValueAtTime(0.28, now + preset.attack);
    }

    glideTo(targetFreq, glideTime) {
      const now = audioCtx.currentTime;
      const preset = INSTRUMENT_PRESETS[activePreset];

      this.freq = targetFreq;

      if (this.waveguideDelay) {
        const delaySec = 1 / targetFreq;
        this.waveguideDelay.delayTime.cancelScheduledValues(now);
        this.waveguideDelay.delayTime.setTargetAtTime(delaySec, now, glideTime);

        if (this.mod && this.modGain) {
          this.mod.frequency.cancelScheduledValues(now);
          this.mod.frequency.setTargetAtTime(targetFreq * preset.fmRatio, now, glideTime);
          this.modGain.gain.cancelScheduledValues(now);
          this.modGain.gain.setTargetAtTime(delaySec * 0.03 * preset.fmIndex, now, glideTime);
        }
      } else if (this.osc) {
        this.osc.frequency.cancelScheduledValues(now);
        this.osc.frequency.setValueAtTime(this.osc.frequency.value, now);
        this.osc.frequency.exponentialRampToValueAtTime(targetFreq, now + glideTime);
      }
    }

    release() {
      const now = audioCtx.currentTime;
      const preset = INSTRUMENT_PRESETS[activePreset];

      this.gain.gain.cancelScheduledValues(now);
      this.gain.gain.setValueAtTime(this.gain.gain.value, now);
      this.gain.gain.exponentialRampToValueAtTime(0.0001, now + preset.release);

      const stopTime = now + preset.release + 0.1;
      const oscToStop = this.osc;
      const modToStop = this.mod;
      const lfoToStop = this.lfo;
      const pointerToRemove = this.pointer;

      setTimeout(() => {
        try {
          if (oscToStop) {
            oscToStop.stop();
            oscToStop.disconnect();
          }
          if (modToStop) {
            modToStop.stop();
            modToStop.disconnect();
          }
          lfoToStop.stop();
          lfoToStop.disconnect();
        } catch(e) {}
        if (pointerToRemove) {
          pointerToRemove.remove();
        }
      }, (preset.release + 0.2) * 1000);
    }

    updatePointerPosition(x, y) {
      if (!this.pointer) return;
      const rect = playSurface.getBoundingClientRect();
      this.pointer.style.left = `${x - rect.left}px`;
      this.pointer.style.top = `${y - rect.top}px`;
    }
  }

  // Calculate fretless frequency linearly/exponentially between column centers
  function calculateFretlessFrequency(rowElement, clientX) {
    const keys = Array.from(rowElement.querySelectorAll('.pad-key'));
    if (keys.length === 0) return BASE_SA;

    const rowRect = rowElement.getBoundingClientRect();
    const relativeX = clientX - rowRect.left;

    const centers = keys.map(k => {
      const rect = k.getBoundingClientRect();
      return {
        x: rect.left + rect.width / 2 - rowRect.left,
        freq: parseFloat(k.getAttribute('data-freq')),
        element: k
      };
    });

    if (relativeX <= centers[0].x) return { freq: centers[0].freq, element: centers[0].element };
    if (relativeX >= centers[centers.length - 1].x) {
      return { freq: centers[centers.length - 1].freq, element: centers[centers.length - 1].element };
    }

    for (let i = 0; i < centers.length - 1; i++) {
      const left = centers[i];
      const right = centers[i+1];
      if (relativeX >= left.x && relativeX <= right.x) {
        const ratio = (relativeX - left.x) / (right.x - left.x);
        const freq = left.freq * Math.pow(right.freq / left.freq, ratio);
        const activeEl = ratio < 0.5 ? left.element : right.element;
        return { freq, element: activeEl };
      }
    }

    return { freq: centers[0].freq, element: centers[0].element };
  }

  // Render isomorphic grid rows
  function buildGrid() {
    playSurface.innerHTML = '';
    const scaleKey = scaleSelect.value;
    const scale = SCALE_DATA[scaleKey] || SCALE_DATA.bilawal;

    // 4 strings configuration (offset by 5 semitones fourth interval)
    const rowOffsets = [2, 1, 0, -1];

    rowOffsets.forEach((rowOffset) => {
      const rowDiv = document.createElement('div');
      rowDiv.className = 'pad-row';

      scale.swars.forEach((swar, colIdx) => {
        const interval = scale.intervals[colIdx];
        const freq = BASE_SA * Math.pow(2, rowOffset) * Math.pow(2, interval / 12);

        const keyDiv = document.createElement('div');
        keyDiv.className = 'pad-key';
        if (swar === 'Sa') {
          keyDiv.classList.add('sa-root');
        }
        keyDiv.setAttribute('data-freq', freq);

        keyDiv.innerHTML = `
          <div class="note-name">${swar}</div>
          <div class="note-swar">${freq.toFixed(1)} Hz</div>
        `;
        rowDiv.appendChild(keyDiv);
      });

      playSurface.appendChild(rowDiv);
    });
  }

  function createPointerElement() {
    const pointer = document.createElement('div');
    pointer.className = 'touch-pointer';
    pointer.style.display = 'block';
    playSurface.appendChild(pointer);
    return pointer;
  }

  // Multi-touch tracking event listeners
  function handleTouchStart(e) {
    e.preventDefault();
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    Array.from(e.changedTouches).forEach(touch => {
      const rowEl = document.elementFromPoint(touch.clientX, touch.clientY)?.closest('.pad-row');
      if (rowEl) {
        const { freq, element } = calculateFretlessFrequency(rowEl, touch.clientX);
        const pointer = createPointerElement();
        
        element.classList.add('active-touch');
        
        const voice = new SynthVoice(freq, touch.clientX, touch.clientY, pointer);
        activeVoices[touch.identifier] = { voice, lastElement: element, rowEl };
      }
    });
  }

  function handleTouchMove(e) {
    e.preventDefault();
    Array.from(e.touches).forEach(touch => {
      const voiceData = activeVoices[touch.identifier];
      if (voiceData) {
        const { freq, element } = calculateFretlessFrequency(voiceData.rowEl, touch.clientX);
        const glideTime = parseFloat(glideRange.value);

        voiceData.voice.glideTo(freq, glideTime);
        voiceData.voice.updatePointerPosition(touch.clientX, touch.clientY);

        if (element !== voiceData.lastElement) {
          if (voiceData.lastElement) {
            voiceData.lastElement.classList.remove('active-touch');
          }
          voiceData.lastElement = element;
          element.classList.add('active-touch');
        }
      }
    });
  }

  function handleTouchEnd(e) {
    e.preventDefault();
    Array.from(e.changedTouches).forEach(touch => {
      const voiceData = activeVoices[touch.identifier];
      if (voiceData) {
        voiceData.voice.release();
        if (voiceData.lastElement) {
          voiceData.lastElement.classList.remove('active-touch');
        }
        delete activeVoices[touch.identifier];
      }
    });
  }

  playSurface.addEventListener('touchstart', handleTouchStart, { passive: false });
  playSurface.addEventListener('touchmove', handleTouchMove, { passive: false });
  playSurface.addEventListener('touchend', handleTouchEnd, { passive: false });
  playSurface.addEventListener('touchcancel', handleTouchEnd, { passive: false });

  // Mouse inputs
  let mouseActiveId = 'mouse-voice';
  playSurface.addEventListener('mousedown', (e) => {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const rowEl = e.target.closest('.pad-row');
    if (rowEl) {
      const { freq, element } = calculateFretlessFrequency(rowEl, e.clientX);
      const pointer = createPointerElement();
      element.classList.add('active-touch');
      
      const voice = new SynthVoice(freq, e.clientX, e.clientY, pointer);
      activeVoices[mouseActiveId] = { voice, lastElement: element, rowEl };
    }
  });

  playSurface.addEventListener('mousemove', (e) => {
    const voiceData = activeVoices[mouseActiveId];
    if (voiceData && e.buttons === 1) {
      const { freq, element } = calculateFretlessFrequency(voiceData.rowEl, e.clientX);
      const glideTime = parseFloat(glideRange.value);

      voiceData.voice.glideTo(freq, glideTime);
      voiceData.voice.updatePointerPosition(e.clientX, e.clientY);

      if (element !== voiceData.lastElement) {
        if (voiceData.lastElement) {
          voiceData.lastElement.classList.remove('active-touch');
        }
        voiceData.lastElement = element;
        element.classList.add('active-touch');
      }
    }
  });

  window.addEventListener('mouseup', () => {
    const voiceData = activeVoices[mouseActiveId];
    if (voiceData) {
      voiceData.voice.release();
      if (voiceData.lastElement) {
        voiceData.lastElement.classList.remove('active-touch');
      }
      delete activeVoices[mouseActiveId];
    }
  });

  // Preset Buttons
  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activePreset = btn.getAttribute('data-preset');
    };
  });

  scaleSelect.onchange = buildGrid;

  // Build grid
  buildGrid();

  initAppShell({ title: pageTitle });
})();
</script>
</body>
</html>
