<style>
  .inst-filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
  .filter-pill {
    padding:8px 16px; border-radius:20px; border:1.5px solid var(--border);
    background:var(--card-bg); color:var(--text); font-size:0.8rem; font-weight:600;
    cursor:pointer; transition:all 0.2s ease; white-space:nowrap;
  }
  .filter-pill:hover { border-color:var(--accent); color:var(--accent); }
  .filter-pill.active { background:var(--accent); color:#fff; border-color:var(--accent); }

  .inst-search-wrap {
    position:relative; margin-bottom:18px;
  }
  .inst-search-wrap input {
    width:100%; padding:12px 16px 12px 42px; border-radius:14px;
    border:1.5px solid var(--border); background:var(--card-bg); color:var(--text);
    font-size:0.9rem; outline:none; transition:border 0.2s;
  }
  .inst-search-wrap input:focus { border-color:var(--accent); }
  .inst-search-wrap .search-icon {
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    color:var(--subtitle); font-size:1.1rem; pointer-events:none;
  }

  .inst-grid {
    display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
    gap:14px; margin-top:10px;
  }
  .inst-card {
    background:var(--card-bg); border:1.5px solid var(--border); border-radius:16px;
    padding:18px; text-decoration:none; color:var(--text); display:flex; flex-direction:column;
    gap:10px; transition:all 0.25s ease; cursor:pointer; position:relative; overflow:hidden;
  }
  .inst-card:hover {
    border-color:var(--accent); transform:translateY(-3px);
    box-shadow:0 8px 25px rgba(0,0,0,0.15);
  }
  .inst-card-top { display:flex; align-items:center; gap:12px; }
  .inst-card-icon {
    width:48px; height:48px; border-radius:14px; display:flex; align-items:center;
    justify-content:center; font-size:1.6rem; flex-shrink:0;
  }
  .inst-card-info { flex:1; min-width:0; }
  .inst-card-name { font-weight:700; font-size:0.95rem; margin:0 0 2px; }
  .inst-card-cat {
    font-size:0.65rem; font-weight:600; padding:3px 8px; border-radius:10px;
    display:inline-block; text-transform:uppercase; letter-spacing:0.04em;
  }
  .inst-card-desc { font-size:0.78rem; color:var(--subtitle); line-height:1.4; margin:0; }
  .inst-card-tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:auto; }
  .inst-card-tag {
    font-size:0.65rem; color:var(--subtitle); background:var(--bg);
    padding:3px 8px; border-radius:8px;
  }
  .inst-card-play {
    font-size:0.75rem; font-weight:700; color:var(--accent); margin-left:auto;
  }
  .inst-card.coming-soon { opacity:0.6; pointer-events:none; }
  .inst-card .soon-badge {
    position:absolute; top:10px; right:10px; background:#f39c12; color:#fff;
    font-size:0.6rem; font-weight:700; padding:3px 8px; border-radius:8px;
  }

  /* Category colors */
  .cat-indian { background:rgba(255,107,53,0.12); color:#e65100; }
  .icon-indian { background:rgba(255,107,53,0.1); }
  .cat-keyboard { background:rgba(103,58,183,0.12); color:#5e35b1; }
  .icon-keyboard { background:rgba(103,58,183,0.1); }
  .cat-string { background:rgba(33,150,243,0.12); color:#1565c0; }
  .icon-string { background:rgba(33,150,243,0.1); }
  .cat-percussion { background:rgba(233,30,99,0.12); color:#c2185b; }
  .icon-percussion { background:rgba(233,30,99,0.1); }
  .cat-woodwind { background:rgba(0,150,136,0.12); color:#00796b; }
  .icon-woodwind { background:rgba(0,150,136,0.1); }
  .cat-brass { background:rgba(255,193,7,0.12); color:#f57f17; }
  .icon-brass { background:rgba(255,193,7,0.1); }
  .cat-utility { background:rgba(96,125,139,0.12); color:#455a64; }
  .icon-utility { background:rgba(96,125,139,0.1); }
  .cat-gesture { background:rgba(156,39,176,0.12); color:#7b1fa2; }
  .icon-gesture { background:rgba(156,39,176,0.1); }

  .inst-count { font-size:0.8rem; color:var(--subtitle); margin-bottom:6px; }
  .no-results {
    text-align:center; padding:40px 20px; color:var(--subtitle); font-size:0.9rem;
    display:none;
  }

  @media(max-width:600px) {
    .inst-grid { grid-template-columns:1fr; }
  }
</style>

  const CATEGORIES = ['all','indian','keyboard','string','percussion','woodwind','brass','utility','gesture'];

  document.getElementById('instPageTitle').textContent = t.title;
  document.getElementById('instPageSub').textContent = t.sub;
  document.getElementById('instSearch').placeholder = t.search;

  // Build filter pills
  const filtersEl = document.getElementById('instFilters');
  CATEGORIES.forEach(cat => {
    const pill = document.createElement('button');
    pill.className = 'filter-pill' + (cat === 'all' ? ' active' : '');
    pill.textContent = t[cat] || cat;
    pill.onclick = () => {
      filtersEl.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      renderGrid(cat, document.getElementById('instSearch').value.trim().toLowerCase());
    };
    filtersEl.appendChild(pill);
  });

  function renderGrid(activeCat, search) {
    const grid = document.getElementById('instGrid');
    grid.innerHTML = '';
    let count = 0;

    INSTRUMENTS.forEach(inst => {
      // Filter by category
      if (activeCat !== 'all' && inst.cat !== activeCat) return;
      // Filter by search
      if (search) {
        const haystack = (
          (inst.name.en||'') + ' ' + (inst.name.gu||'') + ' ' + (inst.name.hi||'') + ' ' +
          (inst.desc.en||'') + ' ' + inst.cat + ' ' + inst.tags.join(' ')
        ).toLowerCase();
        if (!haystack.includes(search)) return;
      }

      count++;
      const card = document.createElement('a');
      card.className = 'inst-card' + (inst.live ? '' : ' coming-soon');
      card.href = inst.live ? inst.href : 'javascript:void(0)';

      const catClass = 'cat-' + inst.cat;
      const iconClass = 'icon-' + inst.cat;
      const name = inst.name[lang] || inst.name.en;
      const desc = inst.desc[lang] || inst.desc.en;

      let tagsHtml = inst.tags.map(tag => `<span class="inst-card-tag">${tag}</span>`).join('');

      card.innerHTML = `
        ${!inst.live ? `<span class="soon-badge">${t.comingSoon}</span>` : ''}
        <div class="inst-card-top">
          <div class="inst-card-icon ${iconClass}">${inst.icon}</div>
          <div class="inst-card-info">
            <p class="inst-card-name">${name}</p>
            <span class="inst-card-cat ${catClass}">${t[inst.cat] || inst.cat}</span>
          </div>
        </div>
        <p class="inst-card-desc">${desc}</p>
        <div class="inst-card-tags">
          ${tagsHtml}
          <span class="inst-card-play">${inst.live ? t.playNow : ''}</span>
        </div>`;
      grid.appendChild(card);
    });

    // Update count
    document.getElementById('instCount').textContent = `${t.showing} ${count} ${t.of} ${INSTRUMENTS.length} ${t.instruments}`;
    document.getElementById('noResults').style.display = count === 0 ? 'block' : 'none';
    document.getElementById('noResults').textContent = t.noResults;
  }

  // Search handler
  document.getElementById('instSearch').addEventListener('input', function() {
    const activeCat = document.querySelector('.filter-pill.active');
    const cat = CATEGORIES.find(c => (t[c] || c) === activeCat?.textContent) || 'all';
    renderGrid(cat, this.value.trim().toLowerCase());
  });

  // Initial render
  renderGrid('all', '');

  // Init app shell
  initAppShell({ title: t.title });
})();
